<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decorate Your Pumpkin</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7e9;font-family:Arial,sans-serif;color:#34220d}header{background:#f7a33c;padding:12px;text-align:center}h1{margin:8px}main{display:grid;grid-template-columns:minmax(270px,1fr) 300px;gap:14px;max-width:1250px;margin:15px auto;padding:8px}#stage{width:100%;touch-action:none;background:#fbe6c5;border:3px solid #b76b28;border-radius:18px}aside{background:white;padding:12px;border-radius:16px;max-height:80vh;overflow:auto}button,select,label{font:inherit}button{background:#ffdfab;border:2px solid #b76b28;border-radius:10px;padding:9px;margin:3px;cursor:pointer;min-height:42px}button:focus-visible{outline:3px solid blue}button.active{background:#ff9c32}section{border-bottom:1px solid #ddd;padding:8px 0}section h2{font-size:1rem;margin:4px}input[type=color]{width:65px;height:40px}#notice{min-height:24px} @media(max-width:800px){main{grid-template-columns:1fr}aside{max-height:none}}</style><header><a href="./">← Games & Activities</a><h1>🎃 Decorate Your Pumpkin!</h1></header><main><div><svg id="stage" viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg"><rect id="back" width="700" height="620" fill="#fbe6c5"/><g id="pumpkin"><path d="M337 163 Q315 115 354 89 Q344 132 368 167" fill="#518b35" stroke="#306129" stroke-width="6"/><ellipse cx="350" cy="357" rx="250" ry="207" fill="#f58b20" stroke="#a95410" stroke-width="7"/><ellipse cx="260" cy="357" rx="102" ry="204" fill="none" stroke="#c86a16" stroke-width="7" opacity=".6"/><ellipse cx="440" cy="357" rx="102" ry="204" fill="none" stroke="#c86a16" stroke-width="7" opacity=".6"/></g><g id="items"></g><g id="drawings"></g></svg><p id="notice" role="status"></p></div><aside><section><h2>Decorating mode</h2><button id="quick" class="active">Quick Decorate</button><button id="free">Free Decorate</button></section><section><h2>Pumpkin colour</h2><input type="color" id="colour" value="#f58b20"><button onclick="setColour('#f58b20')">Orange</button><button onclick="setColour('#8cbf53')">Green</button><button onclick="setColour('#b58add')">Purple</button><button onclick="setColour('#fff4dc')">White</button></section><section><h2>Add a decoration</h2><button onclick="add('eye')">👁️ Eyes</button><button onclick="add('nose')">🔺 Nose</button><button onclick="add('smile')">😊 Smile</button><button onclick="add('scary')">😈 Scary mouth</button><button onclick="add('hat')">🎩 Hat</button><button onclick="add('glasses')">🕶️ Glasses</button><button onclick="add('star')">⭐ Star</button><button onclick="add('bat')">🦇 Bat</button><button onclick="add('heart')">❤️ Heart</button></section><section><h2>Your own pictures</h2><label>Upload image <input id="upload" type="file" accept="image/*"></label><p>Teacher library: images placed in <code>games/teacher-images/</code> can be added to the gallery in a future update.</p></section><section><h2>Selected decoration</h2><button onclick="duplicate()">Duplicate</button><button onclick="layer(1)">Bring to Front</button><button onclick="layer(-1)">Send to Back</button><button onclick="removeSelected()">Remove</button><label>Size <input id="size" type="range" min="25" max="250" value="100"></label><label>Rotate <input id="rotate" type="range" min="-180" max="180" value="0"></label><button onclick="symmetry()">Mirror copy</button></section><section><h2>Draw on pumpkin</h2><button id="drawbtn">✏️ Draw: Off</button><input type="color" id="ink" value="#252525"><label>Brush <input type="range" id="brush" min="2" max="25" value="6"></label><button id="eraser">Eraser</button><button onclick="undo()">Undo drawing</button></section><section><h2>Background</h2><select id="background"><option value="#fbe6c5">Plain</option><option value="#18253f">Night sky</option><option value="#b4d78a">Pumpkin patch</option><option value="#8a719e">Haunted purple</option></select><button onclick="document.documentElement.requestFullscreen?.()">Full screen</button></section><section><button onclick="download()">⬇ Download My Pumpkin</button><button onclick="sendTeacher()">📨 Send to Teacher</button><button onclick="reset()">Start Over</button></section></aside></main><script>
const ns='http://www.w3.org/2000/svg',stage=document.querySelector('#stage'),items=document.querySelector('#items'),drawings=document.querySelector('#drawings');let mode='quick',selected=null,draw=false,erasing=false,painting=false,last=null,history=[];const shapes={eye:['👀',350,295],nose:['🔺',350,365],smile:['😊',350,430],scary:['😈',350,430],hat:['🎩',350,175],glasses:['🕶️',350,300],star:['⭐',245,260],bat:['🦇',450,260],heart:['❤️',350,375]};function msg(s){document.querySelector('#notice').textContent=s}function setColour(c){document.querySelector('#colour').value=c;document.querySelector('#pumpkin ellipse').setAttribute('fill',c)}document.querySelector('#colour').oninput=e=>setColour(e.target.value);document.querySelector('#background').onchange=e=>document.querySelector('#back').setAttribute('fill',e.target.value);function point(e){let p=stage.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stage.getScreenCTM().inverse())}function select(el){selected=el;document.querySelector('#size').value=el?.dataset.scale||100;document.querySelector('#rotate').value=el?.dataset.angle||0}function position(el){el.setAttribute('transform',`translate(${el.dataset.x} ${el.dataset.y}) rotate(${el.dataset.angle||0}) scale(${(el.dataset.scale||100)/100})`)}function add(type){let [symbol,x,y]=shapes[type];let el=document.createElementNS(ns,'text');el.textContent=symbol;el.setAttribute('text-anchor','middle');el.setAttribute('dominant-baseline','middle');el.setAttribute('font-size','80');el.dataset.x=mode==='quick'?x:350;el.dataset.y=mode==='quick'?y:350;el.dataset.scale=100;el.dataset.angle=0;items.append(el);position(el);select(el)}function makeImage(url){let el=document.createElementNS(ns,'image');el.setAttribute('href',url);el.setAttribute('x',-60);el.setAttribute('y',-60);el.setAttribute('width',120);el.setAttribute('height',120);el.dataset.x=350;el.dataset.y=350;el.dataset.scale=100;el.dataset.angle=0;items.append(el);position(el);select(el)}document.querySelector('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>5e6){msg('Choose an image smaller than 5 MB');return}let r=new FileReader();r.onload=()=>makeImage(r.result);r.readAsDataURL(f)};document.querySelector('#quick').onclick=()=>setMode('quick');document.querySelector('#free').onclick=()=>setMode('free');function setMode(m){mode=m;document.querySelector('#quick').classList.toggle('active',m==='quick');document.querySelector('#free').classList.toggle('active',m==='free')}for(let id of ['size','rotate'])document.querySelector('#'+id).oninput=e=>{if(!selected)return;selected.dataset[id==='size'?'scale':'angle']=e.target.value;position(selected)};function duplicate(){if(!selected)return;let copy=selected.cloneNode(true);copy.dataset.x=+copy.dataset.x+35;copy.dataset.y=+copy.dataset.y+35;items.append(copy);position(copy);select(copy)}function symmetry(){if(!selected)return;let copy=selected.cloneNode(true);copy.dataset.x=700-(+copy.dataset.x);items.append(copy);position(copy);select(copy)}function layer(dir){if(!selected)return;if(dir>0)items.append(selected);else items.prepend(selected)}function removeSelected(){selected?.remove();select(null)}let moving=false;stage.addEventListener('pointerdown',e=>{let p=point(e);if(draw){painting=true;stage.setPointerCapture(e.pointerId);let path=document.createElementNS(ns,'path');path.setAttribute('d',`M${p.x} ${p.y}`);path.setAttribute('stroke',erasing?'#fbe6c5':document.querySelector('#ink').value);path.setAttribute('stroke-width',document.querySelector('#brush').value);path.setAttribute('fill','none');path.setAttribute('stroke-linecap','round');drawings.append(path);last=path;history.push(path);return}let el=e.target.closest('#items > *');if(el){select(el);if(mode==='free'){moving=true;stage.setPointerCapture(e.pointerId)}}});stage.addEventListener('pointermove',e=>{let p=point(e);if(painting&&last){last.setAttribute('d',last.getAttribute('d')+` L${p.x} ${p.y}`)}else if(moving&&selected){selected.dataset.x=p.x;selected.dataset.y=p.y;position(selected)}});stage.addEventListener('pointerup',()=>{painting=false;moving=false;last=null});document.querySelector('#drawbtn').onclick=e=>{draw=!draw;e.target.textContent='✏️ Draw: '+(draw?'On':'Off');e.target.classList.toggle('active',draw)};document.querySelector('#eraser').onclick=e=>{erasing=!erasing;e.target.classList.toggle('active',erasing)};function undo(){history.pop()?.remove()}function reset(){if(!confirm('Start over? This will erase your pumpkin decorations.'))return;items.replaceChildren();drawings.replaceChildren();history=[];select(null);setColour('#f58b20');msg('Pumpkin cleared')}function exportSvg(){let copy=stage.cloneNode(true);copy.setAttribute('xmlns',ns);return new XMLSerializer().serializeToString(copy)}function download(){let blob=new Blob([exportSvg()],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=700;c.height=620;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);c.toBlob(b=>{let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='my-pumpkin.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})};im.onerror=()=>msg('Could not export this image');im.src=url}function sendTeacher(){msg('Send to Teacher is not connected yet. Please download your pumpkin for now.')} 
</script></html>
