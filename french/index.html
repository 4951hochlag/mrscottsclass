<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réviser du vocabulaire</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#18243b;font:18px Arial,sans-serif}header{background:#fff;padding:18px;text-align:center;border-bottom:1px solid #dce3ef}h1{margin:8px;font-size:clamp(27px,5vw,40px)}main{max-width:920px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #dce3ef;border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 4px 12px #1720330b}button,.btn{font:inherit;cursor:pointer;border:2px solid #d5dfed;background:#fff;border-radius:13px;padding:14px 18px;color:#18243b}button:hover,button:focus-visible{border-color:#3264bd}button.primary{background:#245ab1;color:#fff;border-color:#245ab1}button:disabled{opacity:.45;cursor:not-allowed}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.tile{min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;font-weight:bold}.emoji{font-size:34px}.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.muted{color:#52617b;font-size:15px}input,textarea,select{font:inherit;border:2px solid #cad4e4;border-radius:10px;padding:12px;width:100%;max-width:100%}textarea{min-height:140px}label{display:block;font-weight:bold;margin:14px 0 6px}.hidden{display:none!important}.answer{font-size:clamp(24px,5vw,38px);text-align:center;margin:25px 0}.choice{width:100%;text-align:left;min-height:72px}.choice.correct-choice{background:#d9f3e1;border-color:#299653;color:#155c32}.choice.incorrect-choice{background:#ffe0df;border-color:#c33;color:#8a201c}.good{color:#146b36}.bad{color:#a32d28}.small{padding:8px 12px}.wordrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid #e3e7ee;padding:9px 0}.wordrow span{flex:1}.count{font-size:16px}.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.letters button{font-size:24px}.speaker{padding:8px 12px}.listen-prompt{text-align:center;background:#f4f8ff;border:2px solid #a8bfe7;border-radius:18px;padding:24px;margin:20px 0}.listen-prompt .speaker{font-size:24px;padding:18px 28px;min-height:80px}.listen-prompt p{margin:0 0 14px}.listen-reveal{font-weight:bold;margin-top:14px}.flash-card{width:100%;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f4f8ff;border:3px solid #a8bfe7;border-radius:22px;padding:24px;margin:20px 0;text-align:center}.flash-card .flash-word{font-size:clamp(30px,6vw,48px);font-weight:bold;overflow-wrap:anywhere}.flash-card .flash-hint{font-size:15px;color:#52617b}.flash-actions{display:flex;gap:12px;flex-wrap:wrap}.flash-actions button{flex:1;min-width:180px}.flash-known{background:#e0f5e6;border-color:#248447}.flash-review{background:#fff1dd;border-color:#bd7926}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-column{display:grid;gap:10px;align-content:start}.match-option{width:100%;min-height:68px;text-align:center;overflow-wrap:anywhere}.match-option.active{background:#dceaff;border-color:#245ab1;box-shadow:0 0 0 2px #245ab1}.match-option.matched{background:#d9f3e1;border-color:#299653;color:#155c32}.match-option.wrong{background:#ffe0df;border-color:#c33}.match-head{font-size:15px;font-weight:bold;text-align:center}@media(max-width:480px){.match-grid{gap:7px}.match-option{padding:10px 5px;font-size:16px}}.notice{border-left:4px solid #bf7b17;padding:10px;background:#fff7e8;font-size:15px}.progress-wrap{margin:10px 0 22px}.progress-label{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:bold;color:#29436d;margin-bottom:9px}.progress-track{height:17px;background:#e5ebf5;border-radius:20px;overflow:hidden;border:1px solid #cdd8e8}.progress-fill{height:100%;background:#2b9c66;border-radius:20px;transition:width .25s ease}.progress-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.progress-dot{height:9px;flex:1 1 9px;max-width:18px;background:#dce4ef;border-radius:8px}.progress-dot.done{background:#2b9c66}.instruction-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.instruction-line p{margin:0;flex:1;min-width:180px}.instruction-line .speaker{min-width:52px;min-height:48px}@media print{header,.noprint,button{display:none!important}.panel{box-shadow:none}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../shared/send-to-teacher.js?v=20261015subject"></script></head><body><header><a href="../">← Mr. Scott's Class</a><h1>Réviser du vocabulaire</h1></header><main id="app"></main><script>
const app=document.getElementById('app'), KEY='mrscott-vocab-draft-v1';
const VOCAB_ENDPOINT='https://script.google.com/macros/s/AKfycbwfoOj0ZYa1uzLqO6SLim2tAvalSA7T6gdkpJffhHxc1KnRb4F4rEiTHinsfaW1h03j/exec';
let teacherPassword='',cloudReady=false,submissionMount=null;
function cloudRequest(fields){return new Promise((resolve,reject)=>{const nonce=crypto.randomUUID(),frame=document.createElement('iframe'),form=document.createElement('form');frame.name='vocab_'+nonce.replace(/-/g,'');frame.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';form.method='POST';form.action=VOCAB_ENDPOINT;form.target=frame.name;for(const [k,v] of Object.entries({...fields,nonce})){let el=document.createElement('input');el.type='hidden';el.name=k;el.value=String(v);form.append(el)}let finished=false;const cleanup=()=>{window.removeEventListener('message',receive);clearTimeout(timer);form.remove();frame.remove()};const done=(err,data)=>{if(finished)return;finished=true;cleanup();err?reject(err):resolve(data)};const receive=e=>{const trusted=/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin)||e.origin==='null';if(!trusted)return;const d=e.data;if(d&&d.type==='mrscott-vocab-result'&&d.nonce===nonce)done(null,d)};window.addEventListener('message',receive);const timer=setTimeout(()=>done(Error('Aucune réponse du serveur. Vérifiez le déploiement Apps Script.')),30000);document.body.append(frame,form);form.submit()})}
async function cloudLoad(password){const r=await cloudRequest({action:password?'getAll':'getPublished',password:password||''});if(!r.success)throw Error(r.message||'Chargement impossible');if(!Array.isArray(r.lists))throw Error('Réponse invalide');sets=r.lists;cloudReady=true;return r}
async function cloudSave(){if(!cloudReady||!teacherPassword)throw Error('Connectez-vous comme enseignant avant de modifier les listes.');const r=await cloudRequest({action:'saveAll',password:teacherPassword,lists:JSON.stringify(sets)});if(!r.success)throw Error(r.message||'Enregistrement impossible');return r}
async function teacherLogin(){const password=prompt('Mot de passe enseignant (Google Drive) :');if(password===null)return;try{await cloudLoad(password);teacherPassword=password;teacher()}catch(e){teacherPassword='';alert('Connexion impossible : '+e.message)}}
async function studentCloud(){try{await cloudLoad();student()}catch(e){alert('Impossible de charger les listes : '+e.message)}}
let sets=JSON.parse(localStorage.getItem(KEY)||'[]'),selected=[],activity='',questions=[],index=0,results=[],current='',builtLetters=[],matching=[],matchChoice=null,matchMistakes=new Set(),matchDone=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const alternatives=s=>String(s||'').split(';').map(x=>x.trim()).filter(Boolean);
const primaryEnglish=s=>alternatives(s)[0]||'';
const normalizeAnswer=s=>String(s||'').normalize('NFC').toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
const englishVariants=s=>alternatives(s).flatMap(a=>{const n=normalizeAnswer(a);return n.startsWith('to ')?[n,n.slice(3)]:[n]});
const acceptsEnglish=(answer,translations)=>englishVariants(translations).includes(normalizeAnswer(answer));
const save=()=>localStorage.setItem(KEY,JSON.stringify(sets));
const speak=(s,lang='fr-CA')=>{if(!('speechSynthesis'in window))return alert('Audio non disponible.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=lang;u.rate=.8;speechSynthesis.speak(u)};
const speech=(s,lang='fr-CA')=>'<button class="speaker" aria-label="Écouter en '+(lang.startsWith('en')?'anglais':'français')+'" onclick="speak('+JSON.stringify(s).replace(/"/g,'&quot;')+','+JSON.stringify(lang).replace(/"/g,'&quot;')+')">🔊</button>';
function home(){app.innerHTML='<div class="panel"><h2>Bienvenue !</h2><div class="tiles"><button class="tile" onclick="studentCloud()"><span class="emoji">🎒</span>Élève</button><button class="tile" onclick="teacherLogin()"><span class="emoji">📚</span>Enseignant</button></div></div>'}
function teacher(){if(!teacherPassword)return teacherLogin();app.innerHTML='<div class="panel"><h2>Gestion du vocabulaire</h2><p class="notice">Listes enregistrées dans Google Drive. Les modifications ne sont appliquées qu’après confirmation du serveur.</p><div class="line"><button class="primary" onclick="editSet()">+ Créer une liste</button><button onclick="exportSets()">Exporter les listes</button><label class="btn" style="margin:0">Importer un fichier JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importSets(this)"></label></div><h3>Mes listes</h3><div id="setlist"></div><button onclick="home()">← Accueil</button></div>';renderSets()}
function renderSets(){document.getElementById('setlist').innerHTML=sets.length?sets.map((s,i)=>'<div class="wordrow"><span><b>'+esc(s.name)+'</b> <small>('+s.words.length+' mots) '+(s.published?'✓ Disponible':'Brouillon')+'</small></span><button class="small" onclick="editSet('+i+')">Modifier</button><button class="small" onclick="removeSet('+i+')">Supprimer</button></div>').join(''):'<p>Aucune liste pour le moment.</p>'}
function editSet(i=-1){let s=i<0?{name:'',words:[],published:false}:sets[i];app.innerHTML='<div class="panel"><h2>'+(i<0?'Créer une liste':'Modifier une liste')+'</h2><label>Nom de la liste</label><input id="name" value="'+esc(s.name)+'" placeholder="Les vêtements"><label>Vocabulaire (français ; anglais), une paire par ligne</label><textarea id="words" placeholder="la chemise ; shirt&#10;le pantalon ; pants">'+esc(s.words.map(w=>w.fr+' ; '+w.en).join('\n'))+'</textarea><p class="muted">Vous pouvez coller plusieurs mots ou ajouter des lignes à une liste existante. Les doublons exacts sont ignorés. Séparez les traductions anglaises possibles par des points-virgules (ex. : crier ; to shout ; to yell). « To » est facultatif dans les réponses anglaises.</p><label><input type="checkbox" id="published" style="width:auto" '+(s.published?'checked':'')+'> Disponible aux élèves (tous les appareils)</label><div class="line"><button class="primary" onclick="storeSet('+i+')">Enregistrer</button><button onclick="teacher()">Annuler</button></div><p id="error" class="bad"></p></div>'}
async function storeSet(i){let name=document.getElementById('name').value.trim(),raw=document.getElementById('words').value.split(/\r?\n/).filter(x=>x.trim()),words=[],seen=new Set;for(let row of raw){let p=row.split(/\s*[;\t|]\s*/);if(p.length<2||!p[0].trim()||!p[1].trim()){document.getElementById('error').textContent='Vérifiez cette ligne : '+row;return}let fr=p[0].trim(),en=p.slice(1).join('; ').trim(),key=fr.toLowerCase()+'|'+en.toLowerCase();if(!seen.has(key)){words.push({fr,en});seen.add(key)}}if(!name||!words.length){document.getElementById('error').textContent='Ajoutez un nom et au moins un mot.';return}let obj={name,words,published:document.getElementById('published').checked},previous=i<0?null:sets[i];if(i<0)sets.push(obj);else sets[i]=obj;try{await cloudSave();teacher()}catch(e){if(i<0)sets.pop();else sets[i]=previous;document.getElementById('error').textContent='Non enregistré : '+e.message}}
async function removeSet(i){if(!confirm('Supprimer cette liste ?'))return;const old=sets.slice();sets.splice(i,1);try{await cloudSave();renderSets()}catch(e){sets=old;alert('Suppression non enregistrée : '+e.message)}}
function exportSets(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sets,null,2)],{type:'application/json'}));a.download='listes-vocabulaire.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importSets(el){
  const file=el.files&&el.files[0];
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const incoming=Array.isArray(data)?data:[data];
    if(!incoming.length||!incoming.every(s=>s&&typeof s.name==='string'&&s.name.trim()&&Array.isArray(s.words)&&s.words.length&&s.words.every(w=>w&&typeof w.fr==='string'&&w.fr.trim()&&typeof w.en==='string'&&w.en.trim())))throw Error('invalid');
    const next=sets.map(s=>({...s,words:s.words.map(w=>({...w}))}));
    let added=0,replaced=0,skipped=0;
    for(const item of incoming){
      const name=item.name.trim();
      const index=next.findIndex(s=>s.name.trim().toLocaleLowerCase()===name.toLocaleLowerCase());
      if(index>=0){
        if(!confirm('La liste « '+name+' » existe déjà. Voulez-vous la remplacer ?\\nOK = remplacer ; Annuler = conserver la liste actuelle.')){skipped++;continue}
        next[index]={name,words:item.words.map(w=>({fr:w.fr,en:w.en})),published:next[index].published};
        replaced++;
      }else{
        next.push({name,words:item.words.map(w=>({fr:w.fr,en:w.en})),published:typeof item.published==='boolean'?item.published:true});
        added++;
      }
    }
    if(!added&&!replaced){alert('Aucune liste modifiée.');return}
    const previous=sets;
    sets=next;
    try{
      await cloudSave();
      teacher();
      alert('Importation réussie : '+added+' ajoutée(s), '+replaced+' remplacée(s), '+skipped+' conservée(s).');
    }catch(e){
      sets=previous;
      alert('Import non enregistré : '+e.message);
    }
  }catch(e){
    if(e.message==='invalid'||e instanceof SyntaxError)alert('Fichier invalide.');
    else alert('Erreur lors de l’importation : '+e.message);
  }finally{el.value=''}
}
function student(){const available=sets.map((s,i)=>({...s,i})).filter(s=>s.published&&s.words.length);app.innerHTML='<div class="panel"><h2>1. Choisis tes mots</h2><p class="muted">Appuie sur une liste pour continuer.</p>'+(available.length?'<div class="tiles">'+available.map(s=>'<button class="tile" onclick="selectVocabulary('+s.i+')"><span class="emoji">📖</span><strong>'+esc(s.name)+'</strong><span class="muted">'+s.words.length+' mots</span></button>').join('')+'</div>':'<p>Aucune liste publiée pour le moment.</p>')+'<button onclick="home()">← Accueil</button></div>'}
function selectVocabulary(i){selected=[i];chooseActivity()}
const acts=[['Associer','🧩','match'],['Choix multiple','☑️','multiple'],['Cartes éclair','🗂️','flash'],['Écouter','🔊','listen'],['Construire le mot','🔤','build'],['Écrire le mot','✏️','write']];
function chooseActivity(){if(!selected.length)return student();const descriptions={match:'Trouve les paires',multiple:'Choisis la réponse',flash:'Regarde les cartes',listen:'Écoute et choisis',build:'Place les lettres',write:'Écris la réponse'};app.innerHTML='<div class="panel"><h2>2. Choisis ton jeu</h2><p class="muted">'+esc(sets[selected[0]].name)+'</p><div class="tiles">'+acts.map(a=>'<button class="tile" onclick="chooseCount(\''+a[2]+'\')"><span class="emoji">'+a[1]+'</span><strong>'+a[0]+'</strong><span class="muted">'+descriptions[a[2]]+'</span></button>').join('')+'</div><button onclick="student()">← Changer de liste</button></div>'}
function pool(){let m=new Map;selected.flatMap(i=>sets[i].words).forEach(w=>m.set(w.fr.toLowerCase()+'|'+w.en.toLowerCase(),w));return [...m.values()]}
function chooseCount(a){activity=a;const n=pool().length;app.innerHTML='<div class="panel"><h2>3. Prêt à jouer ?</h2><p class="muted">'+esc(acts.find(x=>x[2]===a)[0])+' — '+esc(sets[selected[0]].name)+'</p><button class="primary tile" style="width:100%;margin:12px 0;font-size:24px" onclick="start('+n+')">▶ Commencer — Toute la liste ('+n+' mots)</button><details><summary style="cursor:pointer;padding:14px;font-weight:bold">Changer le nombre de questions</summary><div class="tiles" style="margin-top:12px">'+[5,10,15,20].map(v=>'<button class="tile" onclick="start('+v+')">'+v+' questions</button>').join('')+'</div></details><button onclick="chooseActivity()">← Retour aux jeux</button></div>'}
function start(n){let p=shuffle(pool());questions=Array.from({length:n},(_,i)=>p[i%p.length]);index=0;results=[];if(activity==='match')showMatch();else showQuestion()}
function showMatch(){if(index>=questions.length)return finish();matching=questions.slice(index,index+5).map((w,i)=>({...w,id:index+i}));matchChoice=null;matchMistakes=new Set();matchDone=new Set();renderMatch()}
function progressHTML(done,total){const pct=total?Math.round(done/total*100):0;return '<div class="progress-wrap" role="group" aria-label="Progression"><div class="progress-label"><span>Progression</span><span id="progress-count">'+done+' / '+total+' mots</span></div><div class="progress-track" role="progressbar" aria-label="Mots terminés" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+done+'"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+(total<=20?'<div class="progress-dots">'+Array.from({length:total},(_,i)=>'<span class="progress-dot '+(i<done?'done':'')+'"></span>').join('')+'</div>':'')+'</div>'}
function updateMatchProgress(){const done=index+matchDone.size,total=questions.length;const wrap=document.querySelector('.progress-wrap');if(wrap)wrap.outerHTML=progressHTML(done,total)}
function instructionAudio(text){return '<div class="instruction-line"><p>'+esc(text)+'</p>'+speech(text)+'</div>'}
function renderMatch(){const english=shuffle(matching);app.innerHTML='<div class="panel"><p class="count">Mots '+(index+1)+' à '+Math.min(index+matching.length,questions.length)+' / '+questions.length+'</p>'+progressHTML(index+matchDone.size,questions.length)+'<h2>Associer 🧩</h2>'+instructionAudio('Choisis un mot français, puis sa traduction anglaise.')+'<div class="match-grid"><div class="match-column"><div class="match-head">Français</div>'+matching.map(w=>'<div class="line" style="margin:0;gap:4px;flex-wrap:nowrap"><button class="match-option" data-match-fr="'+w.id+'" onclick="chooseMatch('+w.id+')" style="flex:1">'+esc(w.fr)+'</button>'+speech(w.fr)+'</div>').join('')+'</div><div class="match-column"><div class="match-head">English</div>'+english.map(w=>'<button class="match-option" data-match-en="'+w.id+'" onclick="answerMatch('+w.id+')">'+esc(primaryEnglish(w.en))+'</button>').join('')+'</div></div><p id="match-feedback" aria-live="polite"></p><div class="line"><button class="small" onclick="if(confirm(\'Quitter cette activité ?\'))student()">Quitter</button><button id="match-next" class="primary hidden" onclick="index+=matching.length;showMatch()">Continuer →</button></div></div>'}
function chooseMatch(id){if(matchDone.has(id))return;matchChoice=id;document.querySelectorAll('[data-match-fr]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.matchFr)===id)});document.getElementById('match-feedback').textContent='Choisis la traduction anglaise.'}
function answerMatch(id){if(matchChoice===null||matchDone.has(id))return;const fr=matching.find(w=>w.id===matchChoice);const feedback=document.getElementById('match-feedback');if(id!==matchChoice){matchMistakes.add(matchChoice);feedback.className='bad';feedback.textContent='Pas tout à fait. Essaie encore !';return}matchDone.add(id);updateMatchProgress();results.push({fr:fr.fr,en:fr.en,ok:!matchMistakes.has(id)});document.querySelector('[data-match-fr="'+id+'"]').classList.remove('active');document.querySelector('[data-match-fr="'+id+'"]').classList.add('matched');document.querySelector('[data-match-fr="'+id+'"]').disabled=true;document.querySelector('[data-match-en="'+id+'"]').classList.add('matched');document.querySelector('[data-match-en="'+id+'"]').disabled=true;matchChoice=null;feedback.className='good';feedback.textContent='Bravo ! '+matchDone.size+' / '+matching.length+' associations trouvées.';if(matchDone.size===matching.length){document.getElementById('match-next').classList.remove('hidden');feedback.textContent+=' Continue pour la suite.'}}
function showQuestion(){if(index>=questions.length)return finish();let w=questions[index];current='';let body='',q=activity==='listen'?'Écoute et choisis la bonne réponse.':activity==='flash'?'Lis et retourne la carte.':activity==='match'?'Associe le mot français à son sens.':activity==='multiple'?'Choisis la bonne traduction.':'Écris le mot en français.';
if(activity==='flash'){showFlash();return}
else if(activity==='multiple'||activity==='listen'){let seen=new Set(englishVariants(w.en));let distractors=shuffle(pool()).filter(o=>{let variants=englishVariants(o.en);if(variants.some(key=>seen.has(key)))return false;variants.forEach(key=>seen.add(key));return true}).slice(0,3);let options=shuffle([w,...distractors]);body=(activity==='listen'?'<div class="listen-prompt"><p>Écoute le mot en français. Tu peux le réécouter.</p>'+speech(w.fr)+'<div id="listen-reveal" class="listen-reveal hidden"></div></div>':'<div class="answer">'+esc(w.fr)+' '+speech(w.fr)+'</div>')+'<div class="tiles">'+options.map((o,i)=>'<div class="line" style="margin:0;flex-wrap:nowrap"><button class="choice" style="flex:1" data-correct="'+(o===w?'yes':'no')+'" onclick="answerChoice(this)">'+esc(primaryEnglish(o.en))+'</button>'+speech(primaryEnglish(o.en),'en-CA')+'</div>').join('')+'</div>';if(options.length===1)body+='<p class="muted">Ajoutez d’autres traductions à la liste pour proposer plusieurs réponses.</p>'}
else if(activity==='build'){builtLetters=[];let chars=shuffle([...w.fr]);body='<div class="answer">'+esc(primaryEnglish(w.en))+' '+speech(primaryEnglish(w.en),'en-CA')+'</div><p class="muted" style="text-align:center">Choisis les lettres dans le bon ordre. Appuie sur une lettre placée pour la retirer.</p><div class="answer" id="built" aria-live="polite">_</div><div class="letters" id="letter-bank">'+chars.map((c,i)=>'<button id="letter'+i+'" data-letter="'+esc(c)+'" onclick="addLetter('+i+')">'+esc(c===' '?'␣':c)+'</button>').join('')+'</div><div class="line"><button onclick="removeLastLetter()">← Enlever la dernière</button><button onclick="clearLetters()">Effacer tout</button><button class="primary" id="check-built" onclick="checkText()">Vérifier</button></div>'}
else body='<div class="answer">'+esc(w.en)+' '+speech(w.en,'en-CA')+'</div><label for="typed">Écris la traduction en français :</label><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Écris en français" onkeydown="if(event.key===\'Enter\'){event.preventDefault();checkText()}"><div class="line"><button class="primary" onclick="checkText()">Vérifier</button></div>';
app.innerHTML='<div class="panel"><p class="count">Question '+(index+1)+' / '+questions.length+'</p>'+progressHTML(index,questions.length)+'<h2>'+q+'</h2>'+instructionAudio(q)+body+'<p id="feedback" aria-live="polite"></p><button class="small" onclick="if(confirm(\'Quitter cette activité ?\'))student()">Quitter</button></div>'}
function showFlash(){if(index>=questions.length)return finish();const w=questions[index];app.innerHTML='<div class="panel"><p class="count">Carte '+(index+1)+' / '+questions.length+'</p>'+progressHTML(index,questions.length)+'<h2>Cartes éclair 🗂️</h2><p>Lis le mot, puis retourne la carte pour vérifier.</p><div class="flash-card" id="flash-card"><span class="flash-hint" id="flash-hint">Français</span><div class="flash-word" id="flash-word">'+esc(w.fr)+'</div><div id="flash-audio">'+speech(w.fr)+'</div></div><div id="flash-before"><button class="primary" style="width:100%" onclick="flipFlash()">🔄 Retourner la carte</button></div><div id="flash-after" class="hidden"><p>Connaissais-tu la traduction ?</p><div class="flash-actions"><button class="flash-review" onclick="gradeFlash(false)">🔁 À revoir</button><button class="flash-known" onclick="gradeFlash(true)">✓ Je savais</button></div></div><div class="line"><button class="small" onclick="if(confirm(\'Quitter cette activité ?\'))student()">Quitter</button></div></div>'}
function flipFlash(){const w=questions[index];document.getElementById('flash-hint').textContent='English';document.getElementById('flash-word').textContent=primaryEnglish(w.en);document.getElementById('flash-audio').classList.add('hidden');document.getElementById('flash-before').classList.add('hidden');document.getElementById('flash-after').classList.remove('hidden')}
function gradeFlash(ok){const w=questions[index];results.push({fr:w.fr,en:w.en,ok});index++;showFlash()}
function answerChoice(button){if(button.disabled)return;const ok=button.dataset.correct==='yes';if(activity==='listen'){const reveal=document.getElementById('listen-reveal');if(reveal){reveal.textContent=questions[index].fr;reveal.classList.remove('hidden')}}document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.correct==='yes')b.classList.add('correct-choice');else if(b===button)b.classList.add('incorrect-choice')});answer(ok)}
function renderBuilt(){current=builtLetters.map(i=>document.getElementById('letter'+i).dataset.letter).join('');const target=document.getElementById('built');target.innerHTML=builtLetters.length?builtLetters.map((i,pos)=>'<button class="small" style="margin:3px" onclick="removeBuiltLetter('+pos+')" aria-label="Retirer cette lettre">'+esc(document.getElementById('letter'+i).dataset.letter===' '?'␣':document.getElementById('letter'+i).dataset.letter)+'</button>').join(''):'_'}
function addLetter(i){const b=document.getElementById('letter'+i);if(!b||b.disabled)return;builtLetters.push(i);b.disabled=true;renderBuilt()}
function removeBuiltLetter(pos){const i=builtLetters.splice(pos,1)[0];if(i===undefined)return;document.getElementById('letter'+i).disabled=false;renderBuilt()}
function removeLastLetter(){removeBuiltLetter(builtLetters.length-1)}
function clearLetters(){builtLetters.forEach(i=>document.getElementById('letter'+i).disabled=false);builtLetters=[];renderBuilt()}
function resetLetters(){clearLetters()}
function checkText(){let v=activity==='build'?current:document.getElementById('typed').value;if(!v.trim())return alert(activity==='build'?'Choisis des lettres avant de vérifier.':'Écris un mot avant de vérifier.');const typed=v.trim().normalize('NFC').toLowerCase(),expected=questions[index].fr.trim().normalize('NFC').toLowerCase();const withoutAccents=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').normalize('NFC');const exact=typed===expected;const missingAccents=activity==='write'&&!exact&&withoutAccents(typed)===withoutAccents(expected);answer(exact||missingAccents,missingAccents)}
function answer(ok,accentReminder=false){let w=questions[index];results.push({fr:w.fr,en:w.en,ok});let f=document.getElementById('feedback');f.className=ok?'good':'bad';f.innerHTML=(ok?'Bravo !'+(accentReminder?' Attention aux accents : '+esc(w.fr):''):'Pas tout à fait. '+(activity==='multiple'||activity==='listen'?'Bonne traduction : '+esc(primaryEnglish(w.en)):'Réponse : '+esc(w.fr)))+' <button class="primary" id="next" onclick="index++;showQuestion()">Continuer →</button>';document.querySelectorAll('.choice,#typed,#built,.letters button').forEach(el=>{if(el.tagName==='BUTTON'||el.tagName==='INPUT')el.disabled=true});document.querySelectorAll('button').forEach(el=>{if(el.textContent.includes('Vérifier'))el.disabled=true})}
function finish(){
 const correct=results.filter(r=>r.ok).length;
 app.innerHTML='<div class="panel"><h2>Activité terminée ! 🎉</h2><p class="answer">'+correct+' / '+results.length+'</p><p>'+esc(acts.find(a=>a[2]===activity)[0])+'</p><h3>'+(activity==='flash'?'Mots à revoir':'Révision')+'</h3>'+results.filter(r=>!r.ok).map(r=>'<p>'+esc(r.fr)+' — '+esc(primaryEnglish(r.en))+'</p>').join('')+'<p class="notice">Envoie tes résultats après au moins cinq questions. Maximum trois envois par session.</p><div class="line noprint"><button class="primary" id="sendTeacher" '+(results.length<5?'disabled':'')+'>📤 Envoyer à l’enseignant</button><button onclick="window.print()">🖨️ Imprimer</button><button class="primary" onclick="student()">Nouvelle activité</button><button onclick="home()">Accueil</button></div></div>';
 setupVocabSubmission();
}
const vocabSubmitKey='mrscott-vocab-send-count-v1';
function vocabSubmissionCount(){return Number(sessionStorage.getItem(vocabSubmitKey)||0)}
function vocabPdf(){
 if(results.length<5)throw Error('Complete at least five questions before sending.');
 if(!window.jspdf?.jsPDF)throw Error('PDF library did not load. Please refresh and try again.');
 const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
 const label=acts.find(a=>a[2]===activity)?.[0]||activity;
 const margin=16,maxWidth=178;
 pdf.setFont('helvetica','bold');pdf.setFontSize(17);pdf.text('French Vocabulary - '+label,margin,20);
 pdf.setFont('helvetica','normal');pdf.setFontSize(11);
 const listNames=selected.map(i=>sets[i]?.name||sets[i]?.title||'Vocabulary list').join(', ');
 let y=30;
 for(const line of pdf.splitTextToSize('Lists: '+listNames,maxWidth)){pdf.text(line,margin,y);y+=6}
 pdf.text('Completed: '+results.length+' | '+(activity==='flash'?'Marked known: ':'Correct: ')+results.filter(r=>r.ok).length+' / '+results.length,margin,y);y+=9;
 pdf.setFontSize(10);
 results.forEach((r,i)=>{
   const status=activity==='flash'?(r.ok?'I knew it':'Needs practice'):(r.ok?'Correct':'Incorrect');
   const lines=pdf.splitTextToSize((i+1)+'. '+r.fr+' - '+r.en+' | '+status,maxWidth);
   if(y+lines.length*5>278){pdf.addPage();y=20}
   pdf.text(lines,margin,y);y+=lines.length*5+3;
 });
 return pdf.output('datauristring');
}
function setupVocabSubmission(){
 if(submissionMount){submissionMount.destroy();submissionMount=null}
 const button=document.getElementById('sendTeacher');
 if(!button||!window.MrScottSendToTeacher)return;
 const activityName=acts.find(a=>a[2]===activity)?.[0]||activity;
 submissionMount=MrScottSendToTeacher.mount({
   button,activity:()=>('French Vocabulary - '+activityName),
   getPdfBase64:vocabPdf,
   beforeSend:()=>{
     if(results.length<5){alert('Complete at least five questions before sending.');return false}
     const count=vocabSubmissionCount();
     if(count>=3){alert('You have already submitted three times this session.');return false}
     if(count>0)return confirm('You have already submitted '+count+' time(s) this session. Send again? '+(3-count)+' submission(s) remaining.');
     return true;
   },
   onSuccess:()=>{sessionStorage.setItem(vocabSubmitKey,String(vocabSubmissionCount()+1));if(vocabSubmissionCount()>=3)button.disabled=true}
 });
 if(vocabSubmissionCount()>=3)button.disabled=true;
}
home();
</script></body></html>
