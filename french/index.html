<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réviser du vocabulaire</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#18243b;font:18px Arial,sans-serif}header{background:#fff;padding:18px;text-align:center;border-bottom:1px solid #dce3ef}h1{margin:8px;font-size:clamp(27px,5vw,40px)}main{max-width:920px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #dce3ef;border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 4px 12px #1720330b}button,.btn{font:inherit;cursor:pointer;border:2px solid #d5dfed;background:#fff;border-radius:13px;padding:14px 18px;color:#18243b}button:hover,button:focus-visible{border-color:#3264bd}button.primary{background:#245ab1;color:#fff;border-color:#245ab1}button:disabled{opacity:.45;cursor:not-allowed}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.tile{min-height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;font-weight:bold}.emoji{font-size:34px}.line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.muted{color:#52617b;font-size:15px}input,textarea,select{font:inherit;border:2px solid #cad4e4;border-radius:10px;padding:12px;width:100%;max-width:100%}textarea{min-height:140px}label{display:block;font-weight:bold;margin:14px 0 6px}.hidden{display:none!important}.answer{font-size:clamp(24px,5vw,38px);text-align:center;margin:25px 0}.choice{width:100%;text-align:left}.good{color:#146b36}.bad{color:#a32d28}.small{padding:8px 12px}.wordrow{display:flex;gap:8px;align-items:center;border-bottom:1px solid #e3e7ee;padding:9px 0}.wordrow span{flex:1}.count{font-size:16px}.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.letters button{font-size:24px}.speaker{padding:8px 12px}.notice{border-left:4px solid #bf7b17;padding:10px;background:#fff7e8;font-size:15px}@media print{header,.noprint,button{display:none!important}.panel{box-shadow:none}}</style></head><body><header><a href="../">← Mr. Scott's Class</a><h1>Réviser du vocabulaire</h1></header><main id="app"></main><script>
const app=document.getElementById('app'), KEY='mrscott-vocab-draft-v1';
const VOCAB_ENDPOINT='https://script.google.com/macros/s/AKfycbwfoOj0ZYa1uzLqO6SLim2tAvalSA7T6gdkpJffhHxc1KnRb4F4rEiTHinsfaW1h03j/exec';
let teacherPassword='',cloudReady=false;
function cloudRequest(fields){return new Promise((resolve,reject)=>{const nonce=crypto.randomUUID(),frame=document.createElement('iframe'),form=document.createElement('form');frame.name='vocab_'+nonce.replace(/-/g,'');frame.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';form.method='POST';form.action=VOCAB_ENDPOINT;form.target=frame.name;for(const [k,v] of Object.entries({...fields,nonce})){let el=document.createElement('input');el.type='hidden';el.name=k;el.value=String(v);form.append(el)}let finished=false;const cleanup=()=>{window.removeEventListener('message',receive);clearTimeout(timer);form.remove();frame.remove()};const done=(err,data)=>{if(finished)return;finished=true;cleanup();err?reject(err):resolve(data)};const receive=e=>{if(!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin))return;const d=e.data;if(d&&d.type==='mrscott-vocab-result'&&d.nonce===nonce)done(null,d)};window.addEventListener('message',receive);const timer=setTimeout(()=>done(Error('Aucune réponse du serveur. Vérifiez le déploiement Apps Script.')),30000);document.body.append(frame,form);form.submit()})}
async function cloudLoad(password){const r=await cloudRequest({action:password?'getAll':'getPublished',password:password||''});if(!r.success)throw Error(r.message||'Chargement impossible');if(!Array.isArray(r.lists))throw Error('Réponse invalide');sets=r.lists;cloudReady=true;return r}
async function cloudSave(){if(!cloudReady||!teacherPassword)throw Error('Connectez-vous comme enseignant avant de modifier les listes.');const r=await cloudRequest({action:'saveAll',password:teacherPassword,lists:JSON.stringify(sets)});if(!r.success)throw Error(r.message||'Enregistrement impossible');return r}
async function teacherLogin(){const password=prompt('Mot de passe enseignant (Google Drive) :');if(password===null)return;try{await cloudLoad(password);teacherPassword=password;teacher()}catch(e){teacherPassword='';alert('Connexion impossible : '+e.message)}}
async function studentCloud(){try{await cloudLoad();student()}catch(e){alert('Impossible de charger les listes : '+e.message)}}
let sets=JSON.parse(localStorage.getItem(KEY)||'[]'),selected=[],activity='',questions=[],index=0,results=[],current='',matching=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const save=()=>localStorage.setItem(KEY,JSON.stringify(sets));
const speak=s=>{if(!('speechSynthesis'in window))return alert('Audio non disponible.');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fr-CA';u.rate=.8;speechSynthesis.speak(u)};
const speech=s=>'<button class="speaker" aria-label="Écouter" onclick="speak('+JSON.stringify(s).replace(/"/g,'&quot;')+')">🔊</button>';
function home(){app.innerHTML='<div class="panel"><h2>Bienvenue !</h2><div class="tiles"><button class="tile" onclick="studentCloud()"><span class="emoji">🎒</span>Élève</button><button class="tile" onclick="teacherLogin()"><span class="emoji">📚</span>Enseignant</button></div></div>'}
function teacher(){if(!teacherPassword)return teacherLogin();app.innerHTML='<div class="panel"><h2>Gestion du vocabulaire</h2><p class="notice">Listes enregistrées dans Google Drive. Les modifications ne sont appliquées qu’après confirmation du serveur.</p><div class="line"><button class="primary" onclick="editSet()">+ Créer une liste</button><button onclick="exportSets()">Exporter les listes</button><label class="btn" style="margin:0">Importer un fichier JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importSets(this)"></label></div><h3>Mes listes</h3><div id="setlist"></div><button onclick="home()">← Accueil</button></div>';renderSets()}
function renderSets(){document.getElementById('setlist').innerHTML=sets.length?sets.map((s,i)=>'<div class="wordrow"><span><b>'+esc(s.name)+'</b> <small>('+s.words.length+' mots) '+(s.published?'✓ Disponible':'Brouillon')+'</small></span><button class="small" onclick="editSet('+i+')">Modifier</button><button class="small" onclick="removeSet('+i+')">Supprimer</button></div>').join(''):'<p>Aucune liste pour le moment.</p>'}
function editSet(i=-1){let s=i<0?{name:'',words:[],published:false}:sets[i];app.innerHTML='<div class="panel"><h2>'+(i<0?'Créer une liste':'Modifier une liste')+'</h2><label>Nom de la liste</label><input id="name" value="'+esc(s.name)+'" placeholder="Les vêtements"><label>Vocabulaire (français ; anglais), une paire par ligne</label><textarea id="words" placeholder="la chemise ; shirt&#10;le pantalon ; pants">'+esc(s.words.map(w=>w.fr+' ; '+w.en).join('\n'))+'</textarea><p class="muted">Vous pouvez coller plusieurs mots ou ajouter des lignes à une liste existante. Les doublons exacts sont ignorés.</p><label><input type="checkbox" id="published" style="width:auto" '+(s.published?'checked':'')+'> Disponible aux élèves (tous les appareils)</label><div class="line"><button class="primary" onclick="storeSet('+i+')">Enregistrer</button><button onclick="teacher()">Annuler</button></div><p id="error" class="bad"></p></div>'}
async function storeSet(i){let name=document.getElementById('name').value.trim(),raw=document.getElementById('words').value.split(/\r?\n/).filter(x=>x.trim()),words=[],seen=new Set;for(let row of raw){let p=row.split(/\s*[;\t|]\s*/);if(p.length<2||!p[0].trim()||!p[1].trim()){document.getElementById('error').textContent='Vérifiez cette ligne : '+row;return}let fr=p[0].trim(),en=p.slice(1).join('; ').trim(),key=fr.toLowerCase()+'|'+en.toLowerCase();if(!seen.has(key)){words.push({fr,en});seen.add(key)}}if(!name||!words.length){document.getElementById('error').textContent='Ajoutez un nom et au moins un mot.';return}let obj={name,words,published:document.getElementById('published').checked},previous=i<0?null:sets[i];if(i<0)sets.push(obj);else sets[i]=obj;try{await cloudSave();teacher()}catch(e){if(i<0)sets.pop();else sets[i]=previous;document.getElementById('error').textContent='Non enregistré : '+e.message}}
async function removeSet(i){if(!confirm('Supprimer cette liste ?'))return;const old=sets.slice();sets.splice(i,1);try{await cloudSave();renderSets()}catch(e){sets=old;alert('Suppression non enregistrée : '+e.message)}}
function exportSets(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sets,null,2)],{type:'application/json'}));a.download='listes-vocabulaire.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importSets(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x)||!x.every(s=>typeof s.name==='string'&&Array.isArray(s.words)&&s.words.every(w=>typeof w.fr==='string'&&typeof w.en==='string')))throw Error();const previous=sets;sets=x.map(s=>({name:s.name,words:s.words,published:!!s.published}));try{await cloudSave();teacher()}catch(e){sets=previous;alert('Import non enregistré : '+e.message)}}catch{alert('Fichier invalide.')}}
function student(){let available=sets.map((s,i)=>({...s,i})).filter(s=>s.published&&s.words.length);app.innerHTML='<div class="panel"><h2>Choisis ton vocabulaire</h2><p class="muted">Tu peux choisir une ou plusieurs listes.</p>'+(available.length?available.map(s=>'<label class="wordrow"><input type="checkbox" class="pick" value="'+s.i+'" style="width:auto"> '+esc(s.name)+' ('+s.words.length+' mots)</label>').join(''):'<p>Aucune liste publiée pour le moment.</p>')+'<div class="line"><button class="primary" onclick="chooseActivity()">Continuer →</button><button onclick="home()">← Accueil</button></div></div>'}
const acts=[['Associer','🧩','match'],['Choix multiple','☑️','multiple'],['Cartes éclair','🗂️','flash'],['Écouter','🔊','listen'],['Construire le mot','🔤','build'],['Écrire le mot','✏️','write']];
function chooseActivity(){selected=[...document.querySelectorAll('.pick:checked')].map(x=>+x.value);if(!selected.length)return alert('Choisis au moins une liste.');app.innerHTML='<div class="panel"><h2>Choisis une activité</h2><div class="tiles">'+acts.map(a=>'<div class="tile panel" style="padding:12px"><span class="emoji">'+a[1]+'</span><button class="primary" onclick="chooseCount(\''+a[2]+'\')">'+a[0]+'</button>'+speech(a[0])+'</div>').join('')+'</div><button onclick="student()">← Retour</button></div>'}
function pool(){let m=new Map;selected.flatMap(i=>sets[i].words).forEach(w=>m.set(w.fr.toLowerCase()+'|'+w.en.toLowerCase(),w));return [...m.values()]}
function chooseCount(a){activity=a;let n=pool().length;app.innerHTML='<div class="panel"><h2>Combien de questions ?</h2><div class="tiles">'+[5,10,15,20].map(v=>'<button class="tile" onclick="start('+v+')">'+v+'</button>').join('')+'<button class="tile primary" onclick="start('+n+')">Toute la liste ('+n+')</button></div><button onclick="chooseActivity()">← Retour</button></div>'}
function start(n){let p=shuffle(pool());questions=Array.from({length:n},(_,i)=>p[i%p.length]);index=0;results=[];showQuestion()}
function showQuestion(){if(index>=questions.length)return finish();let w=questions[index];current='';let body='',q=activity==='listen'?'Écoute et choisis la bonne réponse.':activity==='flash'?'Lis et retourne la carte.':activity==='match'?'Associe le mot français à son sens.':activity==='multiple'?'Choisis la bonne traduction.':'Écris le mot en français.';
if(activity==='flash')body='<div class="answer">'+esc(w.fr)+' '+speech(w.fr)+'</div><button class="primary" onclick="document.getElementById(\'reverse\').classList.remove(\'hidden\')">Retourner la carte</button><div id="reverse" class="hidden"><div class="answer">'+esc(w.en)+'</div><button onclick="answer(true)">Suivant →</button></div>';
else if(activity==='multiple'||activity==='listen'||activity==='match'){let options=shuffle([w,...shuffle(pool().filter(x=>x.fr!==w.fr)).slice(0,3)]);body='<div class="answer">'+(activity==='listen'?speech(w.fr):esc(w.fr)+' '+speech(w.fr))+'</div><div class="tiles">'+options.map(o=>'<button class="choice" onclick="answer('+JSON.stringify(o.fr===w.fr)+')">'+esc(o.en)+'</button>').join('')+'</div>';if(options.length===1)body+='<p class="muted">Ajoutez plus de mots pour proposer plusieurs réponses.</p>'}
else if(activity==='build'){let chars=shuffle([...w.fr]);body='<div class="answer">'+esc(w.en)+'</div><div class="answer" id="built">_</div><div class="letters">'+chars.map((c,i)=>'<button id="letter'+i+'" onclick="addLetter('+i+')">'+esc(c===' '?'␣':c)+'</button>').join('')+'</div><div class="line"><button onclick="resetLetters()">Effacer</button><button class="primary" onclick="checkText()">Vérifier</button></div>'}
else body='<div class="answer">'+esc(w.en)+'</div><input id="typed" autocomplete="off" placeholder="Écris en français"><div class="line"><button class="primary" onclick="checkText()">Vérifier</button></div>';
app.innerHTML='<div class="panel"><p class="count">Question '+(index+1)+' / '+questions.length+'</p><h2>'+q+'</h2>'+body+'<p id="feedback" aria-live="polite"></p><button class="small" onclick="if(confirm(\'Quitter cette activité ?\'))student()">Quitter</button></div>'}
function addLetter(i){current+=document.getElementById('letter'+i).textContent.replace('␣',' ');document.getElementById('letter'+i).disabled=true;document.getElementById('built').textContent=current}
function resetLetters(){current='';showQuestion()}
function checkText(){let v=activity==='build'?current:document.getElementById('typed').value;answer(v.trim().normalize('NFC').toLowerCase()===questions[index].fr.trim().normalize('NFC').toLowerCase())}
function answer(ok){let w=questions[index];results.push({fr:w.fr,en:w.en,ok});let f=document.getElementById('feedback');f.className=ok?'good':'bad';f.innerHTML=(ok?'Bravo !':'Essaie encore la prochaine fois. Réponse : '+esc(w.fr))+' <button class="primary" id="next" onclick="index++;showQuestion()">Continuer →</button>';document.querySelectorAll('.choice,#typed,#built,.letters button').forEach(el=>{if(el.tagName==='BUTTON'||el.tagName==='INPUT')el.disabled=true});document.querySelectorAll('button').forEach(el=>{if(el.textContent.includes('Vérifier'))el.disabled=true})}
function finish(){let correct=results.filter(r=>r.ok).length;app.innerHTML='<div class="panel"><h2>Activité terminée ! 🎉</h2><p class="answer">'+correct+' / '+results.length+'</p><p>'+esc(acts.find(a=>a[2]===activity)[0])+'</p><h3>Révision</h3>'+results.filter(r=>!r.ok).map(r=>'<p>'+esc(r.fr)+' — '+esc(r.en)+'</p>').join('')+'<p class="notice">« Envoyer à l’enseignant » sera activé après la connexion au système de remise existant. Pour le moment, tu peux imprimer ton résultat.</p><div class="line noprint"><button onclick="window.print()">🖨️ Imprimer</button><button class="primary" onclick="student()">Nouvelle activité</button><button onclick="home()">Accueil</button></div></div>'}
home();
</script></body></html>
