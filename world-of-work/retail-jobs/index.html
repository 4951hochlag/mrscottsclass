<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Jobs | Mr. Scott's Class</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#1d2b45;font:18px Arial,sans-serif}header{background:white;text-align:center;padding:25px 15px;border-bottom:2px solid #dce4f1}h1{margin:5px}main{max-width:1050px;margin:24px auto;padding:0 16px}.nav{display:inline-block;margin-bottom:20px;color:#163b75;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,.panel{background:white;border:2px solid #dce4f1;border-radius:18px;padding:22px;box-shadow:0 4px 12px #20305012}.card{cursor:pointer;text-align:center;color:inherit;font:inherit;min-height:180px}.card:focus-visible,button:focus-visible{outline:4px solid #ffb300}.emoji{display:block;font-size:60px;margin-bottom:12px}.card strong{font-size:23px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:bold;background:#2058a5;color:white;margin:5px 5px 5px 0}button.secondary{background:#e7eef9;color:#163b75}button:disabled{opacity:.55;cursor:default}.panel{margin:15px 0}.panel h2{margin-top:0}p,li{line-height:1.6}.choice{display:block;width:100%;text-align:left;background:#eaf1fb;color:#142e52;margin:9px 0}.selected{background:#d8f5e3!important}.wrong{background:#ffe1e1!important}.sequence button{display:block;width:100%;text-align:left;background:#eaf1fb;color:#142e52}.feedback{font-weight:bold;min-height:28px}.muted{color:#52627c}.hidden{display:none}.tag{display:inline-block;background:#eaf1fb;border-radius:10px;padding:9px;margin:5px}@media(max-width:500px){.card{min-height:150px}h1{font-size:28px}}
</style></head><body><header><h1>🛍️ Retail Jobs</h1><p>Learn about jobs in a store</p></header><main><a class="nav" href="../">← World of Work</a><section id="home"><h2>Choose a job</h2><div class="grid" id="cards"></div></section><section id="lesson" class="hidden"><button class="secondary" onclick="home()">← All jobs</button><h1 id="jobTitle"></h1><div class="panel"><h2>Job Description</h2><p id="description"></p><button onclick="speak('description')">🔊 Listen</button></div><div class="panel"><h2>A Day at Work</h2><p id="story"></p><button onclick="speak('story')">🔊 Listen</button></div><div class="panel"><h2>Tools</h2><div id="tools"></div><button onclick="speak('tools')">🔊 Listen</button></div><div class="panel"><h2>Skills</h2><div id="skills"></div><button onclick="speak('skills')">🔊 Listen</button></div><div class="panel"><h2>Check Your Understanding</h2><p id="question"></p><button class="secondary" onclick="speak('question')">🔊 Listen</button><div id="choices"></div><p id="answerFeedback" class="feedback" aria-live="polite"></p></div><div class="panel"><h2>Put the Day in Order</h2><p>Tap what happens first, then next, then last.</p><div class="sequence" id="sequence"></div><p id="sequenceFeedback" class="feedback" aria-live="polite"></p><button class="secondary" onclick="resetSequence()">Try again</button></div><div class="panel"><h2>Would You Like This Job?</h2><button onclick="reflect('Yes')">👍 Yes</button><button onclick="reflect('Maybe')">🤔 Maybe</button><button onclick="reflect('No')">👎 No</button><p id="reflection" class="feedback" aria-live="polite"></p></div><button class="secondary" onclick="home()">← Choose another job</button></section></main><script>
const jobs=[["Cashier","🛒","Takes payments and gives receipts.","Mia","Mia checks her register. She scans the customer's items. The customer pays. Mia gives a receipt.",["cash register","scanner","receipt"],["counting","being careful","speaking politely"],["What does Mia scan?","Items","Shelves"],["Mia checks the register.","Mia scans the items.","Mia gives a receipt."]],["Stocker","📦","Unpacks products and puts them neatly on shelves.","Jordan","Jordan checks the delivery list. Jordan opens boxes safely. Jordan checks product labels and puts products on shelves.",["boxes","delivery list","shelves"],["lifting safely","organizing","following directions"],["Where does Jordan put products?","On shelves","At the checkout"],["Jordan checks the delivery list.","Jordan opens boxes.","Jordan puts products on shelves."]],["Inventory Clerk","📋","Counts products and records how many are in stock.","Sofia","Sofia opens the inventory list. She counts the puzzles. She records the number on her tablet and checks the count.",["inventory list","tablet","products"],["counting","recording numbers","checking work"],["What does Sofia record?","The number of products","The weather"],["Sofia opens the list.","Sofia counts products.","Sofia records the number."]],["Store Cleaner","🧹","Cleans the store and helps keep everyone safe.","Leo","Leo checks his cleaning list and puts on gloves. He sweeps the entrance. When he sees a spill, he puts out a warning sign and cleans it.",["gloves","broom","warning sign"],["working safely","following a checklist","noticing spills"],["What does Leo put near a spill?","A warning sign","A price tag"],["Leo puts on gloves.","Leo puts out a warning sign.","Leo cleans the spill."]],["Price Tagger","🏷️","Puts the correct price labels on products.","Alex","Alex checks the price list. Alex finds the matching products. Alex attaches the correct price tags and checks each label.",["price list","price tags","products"],["matching numbers","attention to detail","checking work"],["What does Alex put on products?","Price tags","Receipts"],["Alex checks the price list.","Alex attaches the tags.","Alex checks the labels."]],["Customer Helper","🙋","Answers questions and helps customers find products.","Amira","Amira learns about the store's specials. A customer asks about winter coats. Amira listens and shows the customer where the coats are.",["store map","product signs","specials list"],["listening","speaking politely","helping others"],["What does Amira help a customer find?","Winter coats","A broom"],["Amira learns about specials.","A customer asks a question.","Amira shows the coats."]],["Store Manager","👔","Organizes the store, assigns tasks, and checks that work is done.","Sam","Sam checks what needs to be done today. Sam gives workers their tasks. Sam checks the store and helps the team solve a problem.",["task list","schedule","checklist"],["planning","teamwork","problem solving"],["What does Sam give workers?","Tasks","Price tags only"],["Sam checks the task list.","Sam assigns jobs.","Sam checks the work."]],["Store Greeter","👋","Welcomes customers and helps them feel comfortable.","Taylor","Taylor stands near the entrance. Taylor smiles and welcomes customers. Taylor answers a simple question and says goodbye when they leave.",["entrance sign","store information","name tag"],["greeting politely","listening","being friendly"],["Where does Taylor welcome customers?","At the entrance","In the stockroom"],["Taylor stands at the entrance.","Taylor welcomes a customer.","Taylor says goodbye."]]];let current=-1,step=0;
const el=id=>document.getElementById(id);
jobs.forEach((j,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="emoji">'+j[1]+'</span><strong>'+j[0]+'</strong>';b.onclick=()=>openJob(i);el('cards').appendChild(b)});
function openJob(i){current=i;let j=jobs[i];speechSynthesis.cancel();el('home').classList.add('hidden');el('lesson').classList.remove('hidden');el('jobTitle').textContent=j[1]+' '+j[0];el('description').textContent=j[2];el('story').textContent=j[4];for(let [id,arr] of [['tools',j[5]],['skills',j[6]]]){el(id).replaceChildren();arr.forEach(x=>{let s=document.createElement('span');s.className='tag';s.textContent=x;el(id).appendChild(s)})}el('question').textContent=j[7][0];el('choices').replaceChildren();el('answerFeedback').textContent='';let options=[j[7][1],j[7][2]];if(i%2)options.reverse();options.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{el('answerFeedback').textContent=x===j[7][1]?'Correct! Great work.':'Try again.';b.className='choice '+(x===j[7][1]?'selected':'wrong')};el('choices').appendChild(b)});el('reflection').textContent='';resetSequence();scrollTo(0,0)}
function speak(id){if(!('speechSynthesis' in window)){alert('Audio is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(el(id).textContent);u.lang='en-CA';u.rate=.85;speechSynthesis.speak(u)}
function home(){speechSynthesis.cancel();el('lesson').classList.add('hidden');el('home').classList.remove('hidden');scrollTo(0,0)}
function resetSequence(){step=0;el('sequenceFeedback').textContent='';el('sequence').replaceChildren();let items=jobs[current][8].map((s,i)=>({s,i}));items=[items[2],items[0],items[1]];items.forEach(item=>{let b=document.createElement('button');b.textContent=item.s;b.onclick=()=>{if(item.i===step){b.disabled=true;b.className='selected';step++;el('sequenceFeedback').textContent=step===3?'Great! You put the day in order.':'Correct! What happens next?'}else{el('sequenceFeedback').textContent='Try again. Think about what happens next.'}};el('sequence').appendChild(b)})}
function reflect(value){el('reflection').textContent='You chose: '+value+'. Thank you for sharing!'}
</script></body></html>
