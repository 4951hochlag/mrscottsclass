<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retail Jobs | Mr. Scott's Class</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#1d2b45;font:18px Arial,sans-serif}header{background:white;text-align:center;padding:25px 15px;border-bottom:2px solid #dce4f1}h1{margin:5px}main{max-width:1050px;margin:24px auto;padding:0 16px}.nav{display:inline-block;margin-bottom:20px;color:#163b75;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card,.panel{background:white;border:2px solid #dce4f1;border-radius:18px;padding:22px;box-shadow:0 4px 12px #20305012}.card{cursor:pointer;text-align:center;color:inherit;font:inherit;min-height:180px}.card:focus-visible,button:focus-visible{outline:4px solid #ffb300}.emoji{display:block;font-size:60px;margin-bottom:12px}.card strong{font-size:23px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:bold;background:#2058a5;color:white;margin:5px 5px 5px 0}button.secondary{background:#e7eef9;color:#163b75}button:disabled{opacity:.55;cursor:default}.panel{margin:15px 0}.panel h2{margin-top:0}p,li{line-height:1.6}.choice{display:block;width:100%;text-align:left;background:#eaf1fb;color:#142e52;margin:9px 0}.selected{background:#d8f5e3!important}.wrong{background:#ffe1e1!important}.sequence button{display:block;width:100%;text-align:left;background:#eaf1fb;color:#142e52}.feedback{font-weight:bold;min-height:28px}.muted{color:#52627c}.hidden{display:none}.tag{display:inline-block;background:#eaf1fb;border-radius:10px;padding:9px;margin:5px}@media(max-width:500px){.card{min-height:150px}h1{font-size:28px}}
</style></head><body><header><h1>🛍️ Retail Jobs</h1><p>Learn about jobs in a store</p></header><main><a class="nav" href="../">← World of Work</a><section id="home"><h2>Choose a job</h2><div class="grid" id="cards"></div></section><section id="lesson" class="hidden"><button class="secondary" onclick="home()">← All jobs</button><h1 id="jobTitle"></h1><div class="panel"><h2>Job Description</h2><p id="description"></p><button onclick="speak('description')">🔊 Listen</button></div><div class="panel"><h2>A Day at Work</h2><p id="story"></p><button onclick="speak('story')">🔊 Listen</button></div><div class="panel"><h2>Skills</h2><div id="skills"></div><button onclick="speak('skills')">🔊 Listen</button></div><div class="panel"><h2>Check Your Understanding</h2><p id="question"></p><button class="secondary" onclick="speak('question')">🔊 Listen</button><div id="choices"></div><p id="answerFeedback" class="feedback" aria-live="polite"></p></div><div class="panel"><h2>Put the Day in Order</h2><p>Tap what happens first, then next, then last.</p><div class="sequence" id="sequence"></div><p id="sequenceFeedback" class="feedback" aria-live="polite"></p><button class="secondary" onclick="resetSequence()">Try again</button></div><div class="panel"><h2>Would You Like This Job?</h2><button onclick="reflect('Yes')">👍 Yes</button><button onclick="reflect('Maybe')">🤔 Maybe</button><button onclick="reflect('No')">👎 No</button><p id="reflection" class="feedback" aria-live="polite"></p></div><button class="secondary" onclick="home()">← Choose another job</button></section></main><script>
const jobs=[["Cashier","🛒","Takes payments and gives receipts.","Mia","Mia checks her register. She scans the customer's items. The customer pays. Mia gives a receipt.",["cash register","scanner","receipt"],["counting","being careful","speaking politely"],["What does Mia scan?","Items","Shelves"],["Mia checks the register.","Mia scans the items.","Mia gives a receipt."]],["Stocker","📦","Unpacks products and puts them neatly on shelves.","Jordan","Jordan checks the delivery list. Jordan opens boxes safely. Jordan checks product labels and puts products on shelves.",["boxes","delivery list","shelves"],["lifting safely","organizing","following directions"],["Where does Jordan put products?","On shelves","At the checkout"],["Jordan checks the delivery list.","Jordan opens boxes.","Jordan puts products on shelves."]],["Inventory Clerk","📋","Counts products and records how many are in stock.","Sofia","Sofia opens the inventory list. She counts the puzzles. She records the number on her tablet and checks the count.",["inventory list","tablet","products"],["counting","recording numbers","checking work"],["What does Sofia record?","The number of products","The weather"],["Sofia opens the list.","Sofia counts products.","Sofia records the number."]],["Store Cleaner","🧹","Cleans the store and helps keep everyone safe.","Leo","Leo checks his cleaning list and puts on gloves. He sweeps the entrance. When he sees a spill, he puts out a warning sign and cleans it.",["gloves","broom","warning sign"],["working safely","following a checklist","noticing spills"],["What does Leo put near a spill?","A warning sign","A price tag"],["Leo puts on gloves.","Leo puts out a warning sign.","Leo cleans the spill."]],["Price Tagger","🏷️","Puts the correct price labels on products.","Alex","Alex checks the price list. Alex finds the matching products. Alex attaches the correct price tags and checks each label.",["price list","price tags","products"],["matching numbers","attention to detail","checking work"],["What does Alex put on products?","Price tags","Receipts"],["Alex checks the price list.","Alex attaches the tags.","Alex checks the labels."]],["Customer Helper","🙋","Answers questions and helps customers find products.","Amira","Amira learns about the store's specials. A customer asks about winter coats. Amira listens and shows the customer where the coats are.",["store map","product signs","specials list"],["listening","speaking politely","helping others"],["What does Amira help a customer find?","Winter coats","A broom"],["Amira learns about specials.","A customer asks a question.","Amira shows the coats."]],["Store Manager","👔","Organizes the store, assigns tasks, and checks that work is done.","Sam","Sam checks what needs to be done today. Sam gives workers their tasks. Sam checks the store and helps the team solve a problem.",["task list","schedule","checklist"],["planning","teamwork","problem solving"],["What does Sam give workers?","Tasks","Price tags only"],["Sam checks the task list.","Sam assigns jobs.","Sam checks the work."]],["Store Greeter","👋","Welcomes customers and helps them feel comfortable.","Taylor","Taylor stands near the entrance. Taylor smiles and welcomes customers. Taylor answers a simple question and says goodbye when they leave.",["entrance sign","store information","name tag"],["greeting politely","listening","being friendly"],["Where does Taylor welcome customers?","At the entrance","In the stockroom"],["Taylor stands at the entrance.","Taylor welcomes a customer.","Taylor says goodbye."]]];let current=-1,step=0;
const el=id=>document.getElementById(id);
jobs.forEach((j,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="emoji">'+j[1]+'</span><strong>'+j[0]+'</strong>';b.onclick=()=>openJob(i);el('cards').appendChild(b)});
function openJob(i){current=i;let j=jobs[i];speechSynthesis.cancel();el('home').classList.add('hidden');el('lesson').classList.remove('hidden');el('jobTitle').textContent=j[1]+' '+j[0];el('description').textContent=j[2];el('story').textContent=j[4];for(let [id,arr] of [['tools',j[5]],['skills',j[6]]]){el(id).replaceChildren();arr.forEach(x=>{let s=document.createElement('span');s.className='tag';s.textContent=x;el(id).appendChild(s)})}el('question').textContent=j[7][0];el('choices').replaceChildren();el('answerFeedback').textContent='';let options=[j[7][1],j[7][2]];if(i%2)options.reverse();options.forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{el('answerFeedback').textContent=x===j[7][1]?'Correct! Great work.':'Try again.';b.className='choice '+(x===j[7][1]?'selected':'wrong')};el('choices').appendChild(b)});el('reflection').textContent='';resetSequence();scrollTo(0,0)}
function speak(id){if(!('speechSynthesis' in window)){alert('Audio is not available in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(el(id).textContent);u.lang='en-CA';u.rate=.85;speechSynthesis.speak(u)}
function home(){speechSynthesis.cancel();el('lesson').classList.add('hidden');el('home').classList.remove('hidden');scrollTo(0,0)}
function resetSequence(){step=0;el('sequenceFeedback').textContent='';el('sequence').replaceChildren();let items=jobs[current][8].map((s,i)=>({s,i}));items=[items[2],items[0],items[1]];items.forEach(item=>{let b=document.createElement('button');b.textContent=item.s;b.onclick=()=>{if(item.i===step){b.disabled=true;b.className='selected';step++;el('sequenceFeedback').textContent=step===3?'Great! You put the day in order.':'Correct! What happens next?'}else{el('sequenceFeedback').textContent='Try again. Think about what happens next.'}};el('sequence').appendChild(b)})}
function reflect(value){el('reflection').textContent='You chose: '+value+'. Thank you for sharing!'}
</script>
<style>.lesson-section{margin:15px 0}.lesson-section ul{padding-left:25px}.lesson-section li{margin:7px 0}.quiz-progress{font-weight:bold;color:#163b75}.quiz-result{background:#eaf6ed;border-radius:12px;padding:15px;margin-top:12px}.question-number{font-weight:bold;color:#52627c}.quiz-next{margin-top:12px}</style>
<script>
const expandedJobs=[{"where":"Grocery stores, pharmacies, clothing stores, bookstores, and department stores.","duties":["Welcome customers at the checkout.","Scan or enter products.","Tell customers the total cost.","Accept cash, card, or other approved payments.","Give receipts and help with bags.","Keep the checkout area tidy."],"tools":["Cash register or point-of-sale screen","Barcode scanner","Card payment terminal","Receipt printer","Shopping bags"],"people":"Cashiers speak with customers, other cashiers, supervisors, and store managers.","why":"Customers need a safe, accurate way to pay for their purchases. A friendly cashier helps them leave with a good experience.","day":"At the start of a shift, Mia prepares the checkout. During the day, she scans products, takes payments, and gives receipts. She asks a supervisor for help when she is unsure. Before leaving, she tidies the counter.","questions":[["What is the main job of a cashier?",["Help customers pay for purchases","Repair delivery trucks","Design store buildings"],0],["What tool reads a product barcode?",["Broom","Barcode scanner","Measuring tape"],1],["Where might a cashier work?",["Grocery store","Fire station only","Construction site only"],0],["Who does a cashier help most often?",["Customers","Pilots","Farm animals"],0],["Why are accurate payments important?",["They help the store record sales correctly","They make shelves taller","They replace store signs"],0]]},{"where":"Supermarkets, warehouses, toy stores, hardware stores, and clothing stores.","duties":["Receive boxes of products.","Check labels and product names.","Put products in the correct area.","Arrange items neatly on shelves.","Keep walkways clear.","Tell a supervisor about damaged products."],"tools":["Shelves","Boxes","Stock cart","Product labels","Delivery list"],"people":"Stockers work with delivery workers, inventory clerks, sales staff, and managers.","why":"A well-stocked store helps customers find the items they need and makes shopping easier.","day":"Jordan checks which products arrived. Jordan helps unpack boxes, matches products to their shelf labels, and arranges items neatly. Jordan reports a damaged box to the supervisor and leaves the aisle clear.","questions":[["What does a stocker usually do?",["Put products on shelves","Process tax returns","Drive a school bus"],0],["What helps a stocker find the right shelf?",["Product label","Movie ticket","Weather report"],0],["Where might a stocker work?",["Supermarket","Swimming pool only","Hospital operating room only"],0],["What should a stocker do with damaged products?",["Tell a supervisor","Hide the damage","Sell them without checking"],0],["Why is stocking important?",["Customers can find products","It changes the store's address","It replaces cashiers"],0]]},{"where":"Retail stores, supermarkets, warehouses, and stockrooms.","duties":["Count products in the store or stockroom.","Compare counts with inventory records.","Record quantities carefully.","Notice missing or extra items.","Check product names and codes.","Tell a supervisor when numbers do not match."],"tools":["Inventory sheet","Tablet or computer","Barcode scanner","Clipboard","Product labels"],"people":"Inventory clerks work with stockers, store managers, and other team members.","why":"Stores need to know what they have, what is missing, and what needs to be ordered.","day":"Sofia receives a list of products to count. She finds each product, counts the items, and enters the number on a tablet. When the number does not match the record, she counts again and tells the manager.","questions":[["What does an inventory clerk count?",["Products in stock","Clouds in the sky","Cars on a highway"],0],["Where might inventory information be recorded?",["Tablet or inventory sheet","Lunch menu only","Wall clock"],0],["Why does a store count its products?",["To know what is available","To change the weather","To make receipts longer"],0],["What should a clerk do if a count seems wrong?",["Check the count again","Guess a number","Ignore it"],0],["Who might use the inventory information?",["Store manager","Airplane passenger","Movie actor"],0]]},{"where":"Grocery stores, shopping centres, clothing stores, and other retail shops.","duties":["Sweep or mop floors when assigned.","Empty bins and replace liners.","Wipe approved surfaces.","Keep entrances and aisles tidy.","Notice spills and safety hazards.","Follow cleaning instructions and safety signs."],"tools":["Broom and dustpan","Mop and bucket","Cleaning cloth","Gloves","Wet-floor sign"],"people":"Store cleaners work with managers, other employees, and sometimes customers.","why":"A clean store is more welcoming and helps reduce slips and other hazards.","day":"Leo checks the cleaning list and gathers supplies. He tidies the entrance and empties bins. When he notices a spill, he warns others and follows the store's safety procedure. He returns the supplies when finished.","questions":[["Why is a store cleaner's work important?",["It keeps the store clean and safer","It sets all prices","It orders every product"],0],["What sign warns people about a wet floor?",["Wet-floor sign","Sale sign","Exit receipt"],0],["What might a cleaner use to sweep?",["Broom","Barcode scanner","Cash register"],0],["Who should a cleaner tell about a hazard?",["A supervisor","Nobody","A customer only"],0],["Where might a store cleaner work?",["Clothing store","Only on a farm","Only in an airplane"],0]]},{"where":"Supermarkets, discount stores, clothing stores, bookstores, and pharmacies.","duties":["Read the store's approved price list.","Match price labels to the correct products.","Place labels where customers can see them.","Check that prices are easy to read.","Replace outdated or damaged labels.","Report prices that do not match the list."],"tools":["Price labels","Price list","Label printer","Shelf tags","Product barcode"],"people":"Price taggers work with stockers, cashiers, and store managers.","why":"Clear and correct prices help customers make choices and reduce confusion at checkout.","day":"Alex gets the updated price list. Alex finds the matching products, prints or collects the labels, and places them in the correct spots. Alex checks each price and asks a supervisor about a mismatch.","questions":[["What does a price tagger put on products or shelves?",["Price labels","Receipts for every shopper","Cleaning gloves"],0],["What tells the worker the correct price?",["Approved price list","Random guess","Weather forecast"],0],["Why must labels match products?",["Customers need correct price information","It makes the store louder","It changes product colours"],0],["What should a worker do about a price mismatch?",["Report it","Ignore it","Choose any price"],0],["Where might a price tagger work?",["Pharmacy","Airport runway only","Fire truck only"],0]]},{"where":"Department stores, clothing shops, electronics stores, bookstores, and supermarkets.","duties":["Listen to customer questions.","Help customers locate products.","Explain simple product information.","Show customers where store sections are.","Ask a coworker when unsure.","Speak politely and respectfully."],"tools":["Store map","Product signs","Product information sheet","Store directory","Communication headset"],"people":"Customer helpers speak with shoppers, cashiers, stockers, and supervisors.","why":"Helpful service makes shopping less confusing and helps customers feel welcome.","day":"Amira checks the store's promotions. A customer asks where winter coats are. Amira listens, points out the clothing section, and walks with the customer when needed. She asks a coworker about a question she cannot answer.","questions":[["What should a customer helper do first when asked a question?",["Listen carefully","Walk away","Change the subject"],0],["What might help a worker find a store section?",["Store map","Kitchen timer","Paintbrush"],0],["What if the worker does not know an answer?",["Ask a coworker or supervisor","Make up an answer","Ignore the customer"],0],["Who does a customer helper assist?",["Shoppers","Only delivery trucks","Only computers"],0],["Why is this job important?",["It helps customers find what they need","It replaces all shelves","It changes the store's name"],0]]},{"where":"Small shops, supermarkets, clothing stores, pharmacies, and department stores.","duties":["Plan the day's work.","Assign tasks to employees.","Check that the store is running well.","Support workers who need help.","Respond to customer concerns.","Help make decisions about products and schedules."],"tools":["Work schedule","Task checklist","Computer","Sales report","Store phone"],"people":"Store managers work with all store employees, customers, suppliers, and sometimes owners.","why":"A manager helps the team work together so customers are served and the store runs smoothly.","day":"Sam checks the schedule and reviews the day's priorities. Sam gives employees their assignments, answers questions, and checks the store. When a customer has a concern, Sam listens and helps find a solution.","questions":[["What does a store manager often organize?",["Employee tasks and schedules","City traffic lights","School buses"],0],["Who might ask the manager for help?",["Employees and customers","Only athletes","Only musicians"],0],["What tool can show who is working?",["Work schedule","Receipt roll","Broom"],0],["Why is teamwork important to a manager?",["Workers need to cooperate","It changes the store's walls","It makes labels disappear"],0],["What should a manager do about a customer concern?",["Listen and help solve it","Ignore the concern","Hide from customers"],0]]},{"where":"Large stores, department stores, supermarkets, and shopping centres.","duties":["Welcome customers entering the store.","Use a friendly greeting.","Answer simple questions about store locations.","Point customers toward the correct section.","Tell a supervisor when someone needs more help.","Thank customers as they leave."],"tools":["Name tag","Store map","Entrance sign","Store information sheet","Communication headset"],"people":"Store greeters interact with customers, customer helpers, and supervisors.","why":"A friendly welcome can help customers feel comfortable and find their way around the store.","day":"Taylor arrives near the entrance and checks the store information. Taylor welcomes arriving shoppers, answers a question about the checkout, and directs another customer to the clothing section. Taylor thanks people as they leave.","questions":[["Where does a store greeter usually welcome shoppers?",["Near the entrance","Inside the delivery truck","On the roof"],0],["What is a friendly way to greet a customer?",["Hello, welcome!","Go away!","Do not ask questions!"],0],["What could help a greeter give directions?",["Store map","Mop bucket","Receipt printer"],0],["What if a customer needs help the greeter cannot give?",["Ask a coworker or supervisor","Pretend not to hear","Guess without checking"],0],["Why is a greeter's job useful?",["It helps customers feel welcome","It sets all prices","It repairs the building"],0]]}];
let quizIndex=0,quizScore=0,quizAnswered=false;
function addLessonSection(title,content,list=false){const section=document.createElement('div');section.className='panel lesson-section';const h=document.createElement('h2');h.textContent=title;section.appendChild(h);const body=document.createElement(list?'ul':'p');if(list){content.forEach(t=>{const li=document.createElement('li');li.textContent=t;body.appendChild(li)})}else body.textContent=content;section.appendChild(body);const audio=document.createElement('button');audio.className='secondary';audio.textContent='🔊 Listen';audio.addEventListener('click',()=>speakElement(body));section.appendChild(audio);return section}
function speakElement(node){if(!('speechSynthesis' in window)){alert('Audio is not available in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(node.textContent);u.lang='en-CA';u.rate=.85;speechSynthesis.speak(u)}
function renderExpandedLesson(){const x=expandedJobs[current];const lesson=el('lesson');lesson.querySelectorAll('.lesson-section').forEach(n=>n.remove());const quizPanel=el('question').closest('.panel');const sections=[addLessonSection('Where Do They Work?',x.where),addLessonSection('What Do They Do?',x.duties,true),addLessonSection('Tools and Equipment',x.tools,true),addLessonSection('Who Do They Work With?',x.people),addLessonSection('Why Is This Job Important?',x.why)];sections.forEach(s=>lesson.insertBefore(s,quizPanel));el('description').textContent=jobs[current][2]+' '+x.why;el('story').textContent=x.day;el('skills').closest('.panel').classList.add('hidden');el('sequence').closest('.panel').classList.add('hidden');quizPanel.querySelector('h2').textContent='Check Your Understanding — 5 Questions';const oldListen=quizPanel.querySelector('button.secondary');if(oldListen)oldListen.onclick=()=>speakElement(el('question'));quizIndex=0;quizScore=0;renderQuiz()}
function renderQuiz(){const x=expandedJobs[current],panel=el('question').closest('.panel');panel.querySelectorAll('.quiz-progress,.quiz-next,.quiz-result').forEach(n=>n.remove());const q=el('question'),choices=el('choices'),feedback=el('answerFeedback');choices.replaceChildren();feedback.textContent='';quizAnswered=false;if(quizIndex>=x.questions.length){q.textContent='Lesson complete!';const result=document.createElement('div');result.className='quiz-result';result.setAttribute('aria-live','polite');result.textContent='Your score: '+quizScore+' out of 5.';panel.appendChild(result);const retry=document.createElement('button');retry.className='quiz-next';retry.textContent='Try the same five questions again';retry.onclick=()=>{quizIndex=0;quizScore=0;renderQuiz()};panel.appendChild(retry);return}const progress=document.createElement('p');progress.className='quiz-progress';progress.textContent='Question '+(quizIndex+1)+' of 5';q.before(progress);const item=x.questions[quizIndex];q.textContent=item[0];item[1].forEach((option,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=option;b.onclick=()=>{if(quizAnswered)return;if(i!==item[2]){feedback.textContent='Try again.';b.classList.add('wrong');return}quizAnswered=true;quizScore++;feedback.textContent='Correct! Great work.';b.classList.add('selected');Array.from(choices.children).forEach(c=>c.disabled=true);const next=document.createElement('button');next.className='quiz-next';next.textContent=quizIndex===4?'See my score':'Next question →';next.onclick=()=>{quizIndex++;renderQuiz()};panel.appendChild(next)};choices.appendChild(b)})}
const originalOpenJob=openJob;
openJob=function(i){originalOpenJob(i);renderExpandedLesson()};
</script></body></html>
