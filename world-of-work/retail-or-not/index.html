<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retail or Not Retail? | Mr. Scott's Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fc;color:#172033}main{width:min(950px,94%);margin:24px auto 50px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#172033;text-decoration:none;font-weight:700}h1{font-size:clamp(2rem,6vw,3.3rem);margin:22px 0 6px}.rule{font-size:1.15rem;color:#526078}.question{background:#fff;border:2px solid #e3e8f1;border-radius:24px;padding:24px;margin:22px auto;box-shadow:0 5px 14px rgba(20,35,60,.08);max-width:700px}.place-img{width:100%;height:330px;object-fit:cover;border-radius:16px;background:#e8ebf0}.name{font-size:2rem;font-weight:800;margin:14px 0 5px}.prompt{font-size:1.3rem}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}button{border:0;border-radius:18px;padding:20px 10px;font-size:1.4rem;font-weight:800;cursor:pointer}.retail{background:#dff5e5}.not{background:#ffe3e3}.feedback{min-height:58px;margin-top:18px;padding:13px;border-radius:15px;font-size:1.3rem;font-weight:800}.correct{background:#dff5e5}.wrong{background:#ffe3e3}.next{background:#e5ecff;margin-top:10px;width:100%;display:none}.score{font-weight:700}.chart-title{font-size:1.8rem;margin:30px 0 12px}.tchart{display:grid;grid-template-columns:1fr 1fr;background:white;border:3px solid #172033;border-radius:16px;overflow:hidden;text-align:center}.col:first-child{border-right:3px solid #172033}.col h2{margin:0;padding:14px 8px;border-bottom:3px solid #172033;font-size:1.5rem}.sorted{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;min-height:150px}.sorted-card{border:2px solid #d9dfeb;border-radius:12px;padding:7px;background:#fff}.sorted-card img{width:100%;height:90px;object-fit:cover;border-radius:8px}.sorted-card div{font-weight:800;margin-top:6px;font-size:.95rem}@media(max-width:600px){.buttons{grid-template-columns:1fr}.place-img{height:230px}.sorted{grid-template-columns:1fr}.sorted-card img{height:110px}}
</style></head><body><main>
<div class="top"><a class="back" href="../">← World of Work</a><div class="score" id="score"></div></div>
<h1>Retail or Not Retail?</h1><div class="rule">Look at the picture. Does this place sell goods or services directly to customers?</div>
<div class="question" id="question"><img class="place-img" id="placeImg" alt=""><div class="name" id="name"></div><div class="prompt">Is this retail?</div>
<div class="buttons"><button class="retail" onclick="answer(true)">RETAIL 🛍️</button><button class="not" onclick="answer(false)">NOT RETAIL 🚫</button></div>
<div class="feedback" id="feedback"></div><button class="next" id="nextBtn" onclick="next()">Next →</button></div>
<div class="chart-title">Our T-Chart</div><div class="tchart"><div class="col"><h2>RETAIL</h2><div class="sorted" id="retailCol"></div></div><div class="col"><h2>NOT RETAIL</h2><div class="sorted" id="notCol"></div></div></div>
</main><script>
const items=[
{name:"Pharmacy",img:"https://www.rawpixel.com/image/17298668/modern-pharmacy-storefront-exterior",fallback:"https://images.pexels.com/photos/17003640/pexels-photo-17003640.jpeg",retail:true},
{name:"Shoe Store",img:"https://focsanimall.ro/pictures/original/office-shoes-focsani-2-1920-x-1080-px--65981686e80e3d5d48.png",retail:true},
{name:"Grocery Store",img:"https://www.marketbeat.com/logos/articles/med_20260206123513_3-consumer-staples-stocks-breaking-out-this-month.png",retail:true},
{name:"Restaurant",img:"https://storage.googleapis.com/gvdvyszjzuxralablog/interior-design-for-restaurant.html",retail:true},
{name:"Park",img:"https://imagescdn.homes.com/i2/jAw9-wj1GH2RcsW_OuIxfvDfAkbXTWjdEDz1retrMlA/102/wyngate-park-great-neck-ny.jpg?p=1",retail:false},
{name:"Playground",img:"https://www.miracle-recreation.com/markets/parks/",retail:false},
{name:"School",img:"https://i.pinimg.com/736x/00/00/00/00000000000000000000000000000000.jpg",retail:false},
{name:"Fire Station",img:"https://www.mortarr.com/photo/view/images/project_gallery_images/rice-fergus-miller-architecture-city-of-olympia-fire-station-4-modern-exterior-design/34310",retail:false}
];
let order=[...items].sort(()=>Math.random()-.5),i=0,correct=0,locked=false;
function card(x){return '<div class="sorted-card"><img src="'+x.img+'" alt="'+x.name+'"><div>'+x.name+'</div></div>'}
function show(){let x=order[i];placeImg.src=x.img;placeImg.alt=x.name;name.textContent=x.name;score.textContent="Question "+(i+1)+" of "+order.length;feedback.textContent="";feedback.className="feedback";nextBtn.style.display="none";locked=false}
function answer(choice){if(locked)return;let x=order[i];if(choice===x.retail){locked=true;correct++;feedback.textContent="Correct! ✓";feedback.className="feedback correct";(x.retail?retailCol:notCol).insertAdjacentHTML("beforeend",card(x));nextBtn.style.display="block"}else{feedback.textContent="Try again.";feedback.className="feedback wrong"}}
function next(){i++;if(i<order.length)show();else{question.innerHTML='<div style="font-size:5rem">⭐</div><div class="name">Great work!</div><div class="prompt">You sorted all '+order.length+' places!</div><button class="next" style="display:block" onclick="location.reload()">Try Again</button>';score.textContent="Finished!"}}
show();
</script></body></html>
