<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retail or Not Retail? | Mr. Scott's Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fc;color:#172033}main{width:min(950px,94%);margin:24px auto 50px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:#172033;text-decoration:none;font-weight:700}h1{font-size:clamp(2rem,6vw,3.3rem);margin:22px 0 6px}.rule{font-size:1.15rem;color:#526078}.question{background:#fff;border:2px solid #e3e8f1;border-radius:24px;padding:24px;margin:22px auto;box-shadow:0 5px 14px rgba(20,35,60,.08);max-width:700px}.place-img{width:100%;height:330px;object-fit:cover;border-radius:16px;background:#e8ebf0}.name{font-size:2rem;font-weight:800;margin:14px 0 5px;display:flex;align-items:center;justify-content:center;gap:12px}.speak{background:#e5ecff;border:0;border-radius:50%;width:48px;height:48px;padding:0;font-size:1.6rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.speak:focus{outline:3px solid #3659a7;outline-offset:2px}.prompt{font-size:1.3rem}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}button{border:0;border-radius:18px;padding:20px 10px;font-size:1.4rem;font-weight:800;cursor:pointer}.retail{background:#dff5e5}.not{background:#ffe3e3}.feedback{min-height:58px;margin-top:18px;padding:13px;border-radius:15px;font-size:1.3rem;font-weight:800}.correct{background:#dff5e5}.wrong{background:#ffe3e3}.next{background:#e5ecff;margin-top:10px;width:100%;display:none}.score{font-weight:700}.chart-title{font-size:1.8rem;margin:30px 0 12px}.tchart{display:grid;grid-template-columns:1fr 1fr;background:white;border:3px solid #172033;border-radius:16px;overflow:hidden;text-align:center}.col:first-child{border-right:3px solid #172033}.col h2{margin:0;padding:14px 8px;border-bottom:3px solid #172033;font-size:1.5rem}.sorted{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;min-height:150px}.sorted-card{border:2px solid #d9dfeb;border-radius:12px;padding:7px;background:#fff}.sorted-card img{width:100%;height:90px;object-fit:cover;border-radius:8px}.sorted-card div{font-weight:800;margin-top:6px;font-size:.95rem}@media(max-width:600px){.buttons{grid-template-columns:1fr}.place-img{height:230px}.sorted{grid-template-columns:1fr}.sorted-card img{height:110px}}
</style></head><body><main>
<div class="top"><a class="back" href="../">← World of Work</a><div class="score" id="score"></div></div>
<h1>Retail or Not Retail?</h1><div class="rule">Look at the picture. Does this place sell goods or services directly to customers?</div>
<div class="question" id="question"><img class="place-img" id="placeImg" alt=""><div class="name"><span id="name"></span><button class="speak" type="button" onclick="speakName()" aria-label="Read place name aloud" title="Listen">🔊</button></div><div class="prompt">Is this retail?</div>
<div class="buttons"><button class="retail" onclick="answer(true)">RETAIL 🛍️</button><button class="not" onclick="answer(false)">NOT RETAIL 🚫</button></div>
<div class="feedback" id="feedback"></div><button class="next" id="nextBtn" onclick="next()">Next →</button></div>
<div class="chart-title">Our T-Chart</div><div class="tchart"><div class="col"><h2>RETAIL</h2><div class="sorted" id="retailCol"></div></div><div class="col"><h2>NOT RETAIL</h2><div class="sorted" id="notCol"></div></div></div>
</main><script>
const items=[
{name:"Bakery",img:"images/bakery.jpg",retail:true},
{name:"Book Store",img:"images/book-store.jpg",retail:true},
{name:"Clothing Store",img:"images/clothing-store.jpg",retail:true},
{name:"Coffee Shop",img:"images/coffee-shop.jpg",retail:true},
{name:"Dépanneur",img:"images/depanneur.jpg",retail:true},
{name:"Dollar Store",img:"images/dollar-store.jpg",retail:true},
{name:"Electronics Store",img:"images/electronics-store.jpg",retail:true},
{name:"Flower Store",img:"images/flower-store.jpg",retail:true},
{name:"Furniture Store",img:"images/furniture-store.jpg",retail:true},
{name:"Grocery Store",img:"images/grocery-store.jpg",retail:true},
{name:"Hair Salon",img:"images/hair-salon.jpg",retail:true},
{name:"Hardware Store",img:"images/hardware-store.jpg",retail:true},
{name:"Jewelry Store",img:"images/jewelry%20store.jpg",retail:true},
{name:"Pet Store",img:"images/pet-store.jpg",retail:true},
{name:"Pharmacy",img:"images/pharmacy.jpg",retail:true},
{name:"Restaurant",img:"images/restaurant.jpg",retail:true},
{name:"Shoe Store",img:"images/shoe-store.jpg",retail:true},
{name:"Sporting Goods Store",img:"images/sporting-goods-store.jpg",retail:true},
{name:"Toy Store",img:"images/toy-store.jpg",retail:true},
{name:"City Hall",img:"images/city-hall.jpg",retail:false},
{name:"Construction Site",img:"images/construction-site.jpg",retail:false},
{name:"Factory",img:"images/factory.jpg",retail:false},
{name:"Fire Station",img:"images/fire-station.jpg",retail:false},
{name:"Hospital",img:"images/hospital.jpg",retail:false},
{name:"Library",img:"images/library.jpg",retail:false},
{name:"Office Building",img:"images/office-building.jpg",retail:false},
{name:"Park",img:"images/park.jpg",retail:false},
{name:"Playground",img:"images/playground.jpg",retail:false},
{name:"Police Station",img:"images/police-station.jpg",retail:false},
{name:"Power Plant",img:"images/power-plant.jpg",retail:false},
{name:"Recycling Centre",img:"images/recycling-centre.jpg",retail:false},
{name:"School",img:"images/school.jpg",retail:false},
{name:"Warehouse",img:"images/warehouse.jpg",retail:false}
];
let order=[...items].sort(()=>Math.random()-.5),i=0,correct=0,locked=false;
function card(x){return '<div class="sorted-card"><img src="'+x.img+'" alt="'+x.name+'"><div>'+x.name+'</div></div>'}
function show(){let x=order[i];placeImg.src=x.img;placeImg.alt=x.name;name.textContent=x.name;score.textContent="Question "+(i+1)+" of "+order.length;feedback.textContent="";feedback.className="feedback";nextBtn.style.display="none";locked=false}
function speakName(){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(order[i].name);u.lang="en-CA";u.rate=.85;window.speechSynthesis.speak(u)}
function answer(choice){if(locked)return;let x=order[i];if(choice===x.retail){locked=true;correct++;feedback.textContent="Correct! ✓";feedback.className="feedback correct";(x.retail?retailCol:notCol).insertAdjacentHTML("beforeend",card(x));nextBtn.style.display="block"}else{feedback.textContent="Try again.";feedback.className="feedback wrong"}}
function next(){i++;if(i<order.length)show();else{question.innerHTML='<div style="font-size:5rem">⭐</div><div class="name">Great work!</div><div class="prompt">You sorted all '+order.length+' places!</div><button class="next" style="display:block" onclick="location.reload()">Try Again</button>';score.textContent="Finished!"}}
show();
</script></body></html>
