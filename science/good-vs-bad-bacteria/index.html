<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Good vs. Bad Bacteria — Mr. Scott's Class</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font:18px Arial,sans-serif}header{text-align:center;background:white;padding:26px 16px;border-bottom:1px solid #e4e8f0}main{max-width:850px;margin:25px auto;padding:0 18px 50px}a{color:#245ab1}.panel,.question{background:#fff;border:2px solid #e3e8f1;border-radius:18px;padding:22px;margin:18px 0}.video{position:relative;aspect-ratio:16/9}.video iframe{position:absolute;width:100%;height:100%;border:0;border-radius:12px}.options{display:flex;gap:14px;flex-wrap:wrap;margin-top:15px}label{display:flex;align-items:center;gap:9px;border:2px solid #d5ddec;border-radius:12px;padding:12px 22px;cursor:pointer;min-width:135px}input{width:21px;height:21px}button{border:0;border-radius:12px;background:#245ab1;color:white;font:700 19px Arial;padding:15px 26px;cursor:pointer}button.secondary{background:#e3e8f1;color:#172033}.feedback{margin-top:12px;font-weight:bold}.correct{color:#176b39}.incorrect{color:#a12b2b}#result{font-size:23px;font-weight:bold;margin:20px 0}h1{margin-bottom:7px}@media(max-width:550px){.panel,.question{padding:15px}}</style></head><body><header><a href="../">← Science</a><h1>🦠 Good vs. Bad Bacteria</h1><p>Watch the video, then answer nine true-or-false questions.</p></header><main><section class="panel"><h2>Watch the video</h2><p>Good Bacteria vs Bad Bacteria | What's the Difference? — EMoMee</p><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/io9iVlTQrwE" title="Good Bacteria vs Bad Bacteria by EMoMee" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></section><section><h2>True or False?</h2><p>Choose one answer for each statement. Then press <strong>Check Answers</strong>.</p><form id="quiz"></form><button type="button" id="check">Check Answers</button> <button type="button" class="secondary" id="reset">Try Again</button><div id="result" role="status" aria-live="polite"></div></section></main><script>const questions=[["All bacteria are harmful to humans.",false],["Some bacteria help our bodies digest food.",true],["Bacteria can live in our intestines.",true],["Yogurt can contain helpful bacteria called probiotics.",true],["Harmful bacteria can sometimes make us sick.",true],["Helpful bacteria can protect us from harmful germs.",true],["Bacteria can only live inside the human body.",false],["Some bacteria help break down dead plants and animals in nature.",true],["Washing our hands with soap and water helps remove harmful bacteria.",true]];const quiz=document.getElementById('quiz');questions.forEach(([question],i)=>{const field=document.createElement('fieldset');field.className='question';field.style.minWidth='0';const legend=document.createElement('legend');legend.style.fontWeight='bold';legend.textContent=(i+1)+'. '+question;field.appendChild(legend);const opts=document.createElement('div');opts.className='options';[['True','true'],['False','false']].forEach(([text,value])=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=value;label.append(input,document.createTextNode(text));opts.appendChild(label)});field.appendChild(opts);const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');field.appendChild(feedback);quiz.appendChild(field)});document.getElementById('check').addEventListener('click',()=>{let score=0,answered=0;questions.forEach(([,correct],i)=>{const field=quiz.children[i],chosen=field.querySelector('input:checked'),feedback=field.querySelector('.feedback');if(!chosen){feedback.className='feedback incorrect';feedback.textContent='Please choose True or False.';return}answered++;const ok=(chosen.value==='true')===correct;if(ok)score++;feedback.className='feedback '+(ok?'correct':'incorrect');feedback.textContent=ok?'✓ Correct!':'✗ Correct answer: '+(correct?'True':'False')});document.getElementById('result').textContent=answered===questions.length?'Your score: '+score+' out of '+questions.length:'Answer all nine questions to finish. ('+answered+' of '+questions.length+' answered)'});document.getElementById('reset').addEventListener('click',()=>{quiz.reset();quiz.querySelectorAll('.feedback').forEach(el=>el.textContent='');document.getElementById('result').textContent='';window.scrollTo({top:0,behavior:'smooth'})});</script></body></html>
