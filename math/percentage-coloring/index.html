<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Coloring Activity</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f6f8fc;color:#172033;margin:0;text-align:center}header{background:white;padding:18px}h1{margin:8px;font-size:clamp(1.6rem,5vw,2.5rem)}main{max-width:680px;margin:20px auto;padding:0 14px}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 12px #ccd4e3}a{color:#214a86}.target{font-size:clamp(3rem,10vw,5rem);font-weight:800;color:#2158a6;margin:8px}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:490px;margin:20px auto;background:#3c4b60;padding:3px;border-radius:5px;touch-action:none;user-select:none}.square{aspect-ratio:1;border:0;background:white;cursor:pointer;padding:0;min-width:0}.square.selected{background:#3887e6}.square:focus-visible{outline:3px solid #ff9b00;z-index:1}button.action{border:0;border-radius:12px;background:#2158a6;color:white;padding:14px 22px;font-size:1.1rem;font-weight:700;cursor:pointer;margin:5px}button.secondary{background:#536276}button:disabled{opacity:.5;cursor:default}.counter{font-size:1.4rem;font-weight:bold}.feedback{min-height:2.3em;font-size:1.2rem;font-weight:bold;margin:14px 0}.success{color:#16703c}.hint{color:#9a4d08}.equation{font-size:1.4rem;font-weight:bold;margin:12px}label{font-weight:bold}select{font-size:1rem;padding:8px;border-radius:8px;margin:10px}.small{color:#566278}</style></head><body><header><h1>Percentage Coloring Activity</h1><a href="../">← Back to Math</a></header><main><div class="panel"><label for="level">Choose a level:</label> <select id="level"><option value="10">Easy — multiples of 10%</option><option value="5">Medium — multiples of 5%</option><option value="1">Challenge — any whole percentage</option></select><p>Color the squares to show:</p><div class="target" id="target">30%</div><p class="small">Each square is 1% of the whole grid.</p><div class="grid" id="grid" aria-label="100-square coloring grid"></div><div class="counter" id="counter">0 of 100 squares colored</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="action" id="check">Check Answer</button><button class="action secondary" id="clear">Clear Squares</button><button class="action" id="next" disabled>Next Percentage →</button><div><button id="sendTeacher" disabled>Send to Teacher</button><p id="sendNote" class="small">Complete five questions to send your work.</p></div><div class="equation" id="equation" hidden></div><p class="small">Click or drag across squares to color them. Start on a colored square and drag to erase.</p></div></main><script>const grid=document.getElementById('grid'),counter=document.getElementById('counter'),feedback=document.getElementById('feedback'),targetEl=document.getElementById('target'),equation=document.getElementById('equation'),next=document.getElementById('next'),check=document.getElementById('check');let selected=new Set(),target=30,previous=null,solved=false;let painting=false,paintValue=true;const completedRounds=[];let roundChecks=0;function paint(i,value){if(solved)return;if(value)selected.add(i);else selected.delete(i);const b=grid.children[i];b.classList.toggle('selected',selected.has(i));b.setAttribute('aria-pressed',String(selected.has(i)));b.setAttribute('aria-label','Square '+(i+1)+(selected.has(i)?', colored':', empty'));counter.textContent=selected.size+' of 100 squares colored';feedback.textContent='';feedback.className='feedback'}for(let i=0;i<100;i++){let b=document.createElement('button');b.className='square';b.type='button';b.setAttribute('aria-label','Square '+(i+1)+', empty');b.setAttribute('aria-pressed','false');b.addEventListener('pointerdown',e=>{if(solved)return;e.preventDefault();painting=true;paintValue=!selected.has(i);paint(i,paintValue)});b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();paint(i,!selected.has(i))}});grid.appendChild(b)}grid.addEventListener('pointermove',e=>{if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.classList.contains('square')&&grid.contains(el))paint(Array.prototype.indexOf.call(grid.children,el),paintValue)});window.addEventListener('pointerup',()=>painting=false);window.addEventListener('pointercancel',()=>painting=false);function reset(){selected.clear();solved=false;for(const b of grid.children){b.classList.remove('selected');b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',b.getAttribute('aria-label').replace(', colored',', empty'))}counter.textContent='0 of 100 squares colored';feedback.textContent='';feedback.className='feedback';equation.hidden=true;next.disabled=true;check.disabled=false}function newRound(){reset();roundChecks=0;let step=Number(document.getElementById('level').value),values=100/step+1;let n;do{n=Math.floor(Math.random()*values)*step}while(n===previous&&values>1);target=n;previous=n;targetEl.textContent=n+'%'}check.addEventListener('click',()=>{roundChecks++;if(selected.size===target){completedRounds.push({target,level:document.getElementById('level').selectedOptions[0].text,checks:roundChecks,squares:[...selected]});updateSendAvailability();solved=true;feedback.textContent='Great job! You colored '+target+'% of the grid! 🎉';feedback.className='feedback success';equation.textContent=target+'% = '+target+'/100 = '+(target/100).toFixed(2);equation.hidden=false;next.disabled=false;check.disabled=true}else{feedback.textContent=selected.size<target?'Not quite! Color '+(target-selected.size)+' more square'+(target-selected.size===1?'':'s')+'.':'Not quite! Erase '+(selected.size-target)+' square'+(selected.size-target===1?'':'s')+'.';feedback.className='feedback hint'}});document.getElementById('clear').addEventListener('click',reset);next.addEventListener('click',newRound);document.getElementById('level').addEventListener('change',()=>{previous=null;newRound()});newRound();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../../shared/send-to-teacher.js?v=20261015subject"></script>
<script>
const submissionKey='mrscottPercentageColoringSends';
const submissionCount=()=>Math.min(3,Math.max(0,Number(sessionStorage.getItem(submissionKey))||0));
function updateSendAvailability(){const n=completedRounds.length,c=submissionCount();document.getElementById('sendTeacher').disabled=n<5||c>=3;document.getElementById('sendNote').textContent=c>=3?'Submission limit reached (3 of 3 this session).':n<5?'Complete '+(5-n)+' more question(s) before sending.':n+' questions completed. '+c+' of 3 submissions used.';}
async function activityPdf(){
 if(completedRounds.length<5)throw Error('Complete at least five questions first.');
 if(!window.jspdf?.jsPDF)throw Error('PDF library has not loaded.');
 const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});let y=20;
 pdf.setFont('helvetica','bold');pdf.setFontSize(17);pdf.text('Percentage Coloring',16,y);y+=12;
 pdf.setFont('helvetica','normal');pdf.setFontSize(11);pdf.text('Completed questions: '+completedRounds.length,16,y);y+=12;
 completedRounds.forEach((q,i)=>{if(y>250){pdf.addPage();y=20;}pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.text((i+1)+'. '+q.target+'% | '+q.level+' | Checks: '+q.checks,16,y);y+=7;const cell=3.1;for(let n=0;n<100;n++){const x=17+(n%10)*cell,yy=y+Math.floor(n/10)*cell;pdf.setFillColor(q.squares.includes(n)?56:255,q.squares.includes(n)?135:255,q.squares.includes(n)?230:255);pdf.setDrawColor(175);pdf.rect(x,yy,cell,cell,'FD');}y+=39;});
 return pdf.output('datauristring');
}
if(window.MrScottSendToTeacher)MrScottSendToTeacher.mount({button:'#sendTeacher',activity:'Percentage Coloring',getPdfBase64:activityPdf,beforeSend:()=>{const c=submissionCount();if(completedRounds.length<5)return false;if(c>=3){alert('You have already sent your work three times this session.');return false;}return c===0||confirm('You have already submitted '+c+' time(s). Are you sure you want to submit again?');},onSuccess:()=>{sessionStorage.setItem(submissionKey,String(submissionCount()+1));updateSendAvailability();}});
updateSendAvailability();
</script></body></html>
