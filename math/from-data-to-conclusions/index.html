<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From Data to Conclusions</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fd;color:#172033;font-family:Arial,sans-serif}header{text-align:center;background:white;padding:26px 12px;border-bottom:1px solid #ddd}h1{margin:8px 0}main{max-width:820px;margin:24px auto;padding:0 16px}.back{color:#184e85;font-weight:bold}.intro{text-align:center;font-size:1.2rem}.steps{display:grid;gap:12px;margin:25px 0}.step{border:3px solid #d5dfed;border-radius:18px;background:white;padding:17px;display:flex;align-items:center;gap:14px;min-height:95px}.step strong{font-size:1.3rem}.emoji{font-size:2.4rem}.actions{margin-left:auto;display:flex;gap:6px}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-size:1.1rem;font-weight:bold;background:#e7eef8;color:#183c64}button:focus-visible{outline:3px solid #195bba}button:disabled{opacity:.35;cursor:default}.check{background:#18713b;color:white}.reset{background:#e8edf4}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}#feedback{text-align:center;min-height:50px;font-size:1.35rem;font-weight:bold;margin:20px}.hint{text-align:center;color:#506079}@media(max-width:550px){.step{padding:12px}.step strong{font-size:1.08rem}.emoji{font-size:1.8rem}.actions{gap:3px}button{padding:10px}}</style></head><body><header><h1>From Data to Conclusions</h1><p>Put the steps in the correct order!</p></header><main><a class="back" href="../">← Math</a><p class="intro">What do we do first, next, and last?</p><p class="hint">Use the ↑ and ↓ buttons to move each step.</p><div class="steps" id="steps" aria-label="Steps to put in order"></div><div class="controls"><button class="check" id="check">Check My Answer</button><button class="reset" id="again">Try Again</button></div><p id="feedback" role="status" aria-live="polite"></p></main><script>
const items=[{id:1,title:"Collect Data",emoji:"☑️",description:"Ask questions and record answers."},{id:2,title:"Make Graphs",emoji:"📊",description:"Show the data in a graph."},{id:3,title:"Write Conclusions",emoji:"✏️",description:"Explain what the graph tells us."}];let order=[];const root=document.getElementById('steps'),feedback=document.getElementById('feedback');function render(){root.innerHTML='';order.forEach((id,i)=>{const item=items.find(x=>x.id===id),el=document.createElement('div');el.className='step';el.innerHTML='<span class="emoji" aria-hidden="true">'+item.emoji+'</span><div><strong>'+item.title+'</strong><div>'+item.description+'</div></div>';const actions=document.createElement('div');actions.className='actions';[['↑',-1,'Move '+item.title+' up'],['↓',1,'Move '+item.title+' down']].forEach(([symbol,delta,label])=>{const b=document.createElement('button');b.textContent=symbol;b.setAttribute('aria-label',label);b.disabled=i+delta<0||i+delta>=order.length;b.onclick=()=>{[order[i],order[i+delta]]=[order[i+delta],order[i]];feedback.textContent='';render()};actions.append(b)});el.append(actions);root.append(el)})}function shuffle(){order=[1,2,3];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}if(order.every((v,i)=>v===i+1))[order[0],order[1]]=[order[1],order[0]];feedback.textContent='';render()}document.getElementById('check').onclick=()=>{const correct=order.every((v,i)=>v===i+1);feedback.textContent=correct?'🎉 Great job! Collect Data → Make Graphs → Write Conclusions.':'Not quite. Think about what you need to do first. Try again!';feedback.style.color=correct?'#18713b':'#a34b00'};document.getElementById('again').onclick=shuffle;shuffle();</script></body></html>
