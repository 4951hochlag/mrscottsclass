<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Can You Afford It? | Mr. Scott's Class</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:Arial,sans-serif}main{max-width:850px;margin:20px auto;padding:16px}h1{text-align:center;font-size:clamp(2rem,6vw,3rem)}a{color:#244b93}.panel{background:#fff;border:2px solid #e3e8f1;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 5px 14px #14233c12}.intro{text-align:center;font-size:1.15rem}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{font:inherit;border-radius:12px;border:2px solid #aabbd3;padding:12px;cursor:pointer;background:white}button:focus-visible,select:focus-visible{outline:3px solid orange}.display{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:center}.tile{border:2px solid #dce5f2;border-radius:16px;padding:20px 10px;background:#f8fbff}.tile h2{font-size:1.15rem}.amount{font-size:clamp(2rem,6vw,3.5rem);font-weight:bold;margin:18px 0}.product{font-size:3rem}.tag{display:inline-block;background:#fff0b8;border:2px solid #d0a83c;border-radius:9px;padding:8px 14px;font-size:clamp(1.7rem,5vw,2.7rem);font-weight:bold}.question{text-align:center;font-size:1.6rem;font-weight:bold;margin:25px 0}.answers{display:flex;gap:15px;justify-content:center}.answers button{min-width:135px;font-size:1.5rem;font-weight:bold;background:#e9f2ff}.answers button:disabled{opacity:.55;cursor:default}.feedback{text-align:center;min-height:2em;font-size:1.2rem;font-weight:bold;margin:20px 0}.next{display:block;margin:auto;background:#2556a6;color:white;font-weight:bold}.next:disabled{opacity:.5}.stats{text-align:center;color:#526078}@media(max-width:520px){.display{grid-template-columns:1fr}.panel{padding:16px}}</style></head><body><main><a href="../">← Back to Math</a><h1>Can You Afford It?</h1><p class="intro">Look at how much money you have and the price of the item. Can you afford to buy it?</p><div class="panel"><div class="controls"><label for="range"><strong>Price range:</strong></label><select id="range"><option value="10">$0–$10</option><option value="20" selected>$0–$20</option><option value="50">$0–$50</option><option value="100">$0–$100</option></select><button id="restart">Start Over</button></div><p class="stats" id="stats" aria-live="polite"></p><div class="display"><section class="tile"><h2>You have</h2><div class="amount" id="wallet"></div><small>Money available</small></section><section class="tile"><h2>Item for sale</h2><div class="product" id="emoji" aria-hidden="true"></div><div id="item"></div><p>Price</p><div class="tag" id="price"></div></section></div><div class="question">Can you afford it?</div><div class="answers"><button data-answer="yes">Yes</button><button data-answer="no">No</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" class="next" disabled>Next Item →</button></div></main><script>const $=id=>document.getElementById(id);const items=[['Notebook','📓'],['Pencil case','✏️'],['Backpack','🎒'],['Water bottle','🥤'],['T-shirt','👕'],['Soccer ball','⚽'],['Toy car','🚗'],['Headphones','🎧'],['Book','📚'],['Lunch box','🍱'],['Puzzle','🧩'],['Stuffed animal','🧸']];let wallet=0,price=0,correct=0,answered=0,locked=false,last=-1;const fmt=c=>'$'+(c/100).toFixed(2),rnd=n=>Math.floor(Math.random()*(n+1));function question(){const max=Number($('range').value)*100;let index=rnd(items.length-1);if(index===last)index=(index+1+rnd(items.length-2))%items.length;last=index;const base=Math.max(1,Math.floor(max/100));price=(1+rnd(base*4-1))*25;price=Math.min(price,max);const outcome=rnd(2);if(outcome===0){wallet=Math.min(max,price+rnd(Math.floor((max-price)/25))*25)}else{wallet=Math.max(0,price-25*(1+rnd(Math.max(0,Math.floor(price/25)-1))))}if(rnd(6)===0)wallet=price;$('wallet').textContent=fmt(wallet);$('price').textContent=fmt(price);$('item').textContent=items[index][0];$('emoji').textContent=items[index][1];$('feedback').textContent='';$('next').disabled=true;locked=false;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false);$('stats').textContent='Question '+(answered+1)+' · Correct: '+correct+' / '+answered}function answer(yes){if(locked)return;locked=true;answered++;const can=wallet>=price,good=yes===can;if(good)correct++;$('feedback').textContent=(good?'✓ Correct! ':'Not quite. ')+(can?'You have enough money to buy this item.':'You do not have enough money to buy this item.');$('feedback').style.color=good?'#167a42':'#b33333';$('next').disabled=false;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);$('stats').textContent='Answered: '+answered+' · Correct: '+correct+' · Accuracy: '+Math.round(100*correct/answered)+'%'}document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer==='yes')));$('next').addEventListener('click',question);function reset(){answered=0;correct=0;last=-1;question()}$('restart').addEventListener('click',reset);$('range').addEventListener('change',reset);reset();</script></body></html>
