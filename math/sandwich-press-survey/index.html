<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sandwich Press Survey | Mr. Scott's Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fc;color:#172033}.app{width:min(980px,94%);margin:auto;padding:18px 0 42px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}h1{margin:0;font-size:clamp(1.8rem,5vw,2.7rem)}.sub{color:#647086}.panel{background:white;border:1px solid #dde5ef;border-radius:20px;padding:22px;margin-bottom:18px}.btn{border:0;border-radius:12px;padding:12px 17px;font-size:1rem;font-weight:800;cursor:pointer;min-height:46px}.primary{background:#2563eb;color:white}.secondary{background:#e8eef7;color:#172033}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.screen{display:none}.screen.active{display:block}.progress{font-weight:800;color:#647086;margin-bottom:10px}.question{font-size:clamp(1.4rem,4vw,2rem);margin:6px 0 14px}.ingredients{background:#f6f8fc;border-radius:14px;padding:14px 18px;margin:12px 0 18px}.ingredients strong{display:block;margin-bottom:6px}.ingredients ul{margin:0;padding-left:22px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;border:2px solid #dce5f0;border-radius:14px;padding:14px;font-size:1.08rem;font-weight:750;cursor:pointer}.choice:has(input:checked){border-color:#2563eb;background:#eef5ff}.choice input{width:22px;height:22px}.textinput,textarea{width:100%;font:inherit;font-size:16px;padding:13px;border:2px solid #cbd7e7;border-radius:11px}textarea{min-height:130px}.hidden{display:none!important}.graphCard{break-inside:avoid;background:white;border:1px solid #dde5ef;border-radius:18px;padding:18px;margin:18px 0}.graphTitle{text-align:center;font-weight:900;font-size:1.1rem;margin-bottom:12px}.scroll{overflow-x:auto}.graphWrap{display:grid;grid-template-columns:42px 44px minmax(500px,1fr);min-width:586px;height:300px}.ylabel{display:flex;align-items:center;justify-content:center;font-weight:800}.ylabel span{writing-mode:vertical-rl;transform:rotate(180deg)}.yaxis{display:grid;text-align:right;padding-right:6px;color:#536278;font-weight:700}.plot{display:grid;align-items:end;border-left:3px solid #172033;border-bottom:3px solid #172033;background:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--rh) - 1px),#cfdae8 calc(var(--rh) - 1px),#cfdae8 var(--rh));padding:0 7px}.barcol{height:100%;display:flex;flex-direction:column-reverse;padding:0 5px}.cell{height:var(--rh);border:1px solid #aebfd4;background:#3b82f6}.xlabels{display:grid;margin-left:86px;min-width:500px;padding:8px 7px;font-weight:800;text-align:center;gap:4px}.xlabel{overflow-wrap:anywhere}.axisTitle{text-align:center;margin-left:86px;font-weight:800}.written{border-top:1px solid #dde5ef;padding:12px 0}.written:first-child{border-top:0}.written p{white-space:pre-wrap}.empty{color:#647086;font-style:italic}@media(max-width:650px){.panel{padding:16px}}
#printSheet{display:none}@media print{body>*:not(#printSheet){display:none!important}#printSheet{display:block!important;color:#111;background:#fff;padding:8px;font-family:Arial,sans-serif}#printSheet h1{text-align:center;margin:0 0 8px}.graphCard{border:0;padding:8px;margin:8px 0;page-break-inside:avoid}.graphWrap{min-width:0;grid-template-columns:36px 38px minmax(0,1fr);height:260px}.xlabels{margin-left:74px;min-width:0;font-size:11px}.axisTitle{margin-left:74px}.plot{print-color-adjust:exact;-webkit-print-color-adjust:exact}.cell{background:#3b82f6!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.written{page-break-inside:avoid}}
</style></head><body><main class="app"><header><div><h1>Sandwich Press Survey</h1><div class="sub">LINKS Sandwich Shop</div></div><a class="btn secondary" href="../">← Math</a></header>
<section class="screen active" id="intro"><div class="panel"><h2>LINKS Sandwich Shop Survey</h2><p>Answer each question to help us plan the LINKS sandwich shop.</p><div class="actions"><button class="btn primary" id="start">Start Survey →</button></div></div></section>
<section class="screen" id="survey"><div class="panel"><div class="progress" id="progress"></div><div id="questionBox"></div><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn primary" id="next">Next →</button></div></div></section>
<section class="screen" id="done"><div class="panel"><h2>Survey Complete</h2><p>Your answers have been turned into graphs below. Each choice question has its own graph.</p><div id="results"></div><h2>Written Responses</h2><div id="written"></div><div class="actions"><button class="btn secondary" id="edit">← Review Answers</button><button class="btn primary" id="print">Print / Save as PDF</button><button class="btn secondary" id="restart">Start Over</button></div></div></section></main><section id="printSheet"></section>
<script>
const questions=[
{q:"Would you buy lunch from the LINKS sandwich shop?",type:"one",opts:["Yes","No","Maybe"]},
{q:"Would you order the Ham & Cheese Panini?",type:"one",ingredients:["Ham","Cheese","Mayonnaise","Lettuce","Tomatoes"],opts:["Yes","No","Maybe"]},
{q:"Would you order the Tuna Panini?",type:"one",ingredients:["Tuna spread","Avocado sauce","Pesto sauce","Tomatoes"],opts:["Yes","No","Maybe"]},
{q:"Would you order the Chicken Caesar Wrap?",type:"one",ingredients:["Chicken strips","Caesar sauce","Lettuce","Parmesan cheese"],opts:["Yes","No","Maybe"]},
{q:"Would you order the BBQ Chicken Wrap?",type:"one",ingredients:["Chicken strips","BBQ sauce","Cheese","Lettuce"],opts:["Yes","No","Maybe"]},
{q:"Which item would you be MOST likely to order?",type:"one",opts:["Ham & Cheese Panini","Tuna Panini","Chicken Caesar Wrap","BBQ Chicken Wrap","None of the above"]},
{q:"Would you order a Pizza Panini?",type:"one",ingredients:["Pizza sauce","Mozzarella cheese","Vegetables of your choice"],opts:["Yes","No","Maybe"]},
{q:"If we offer a Pizza Panini, which vegetables would you like on it?",type:"multi",opts:["Tomatoes","Green Peppers","Mushrooms","Onions","Black Olives","Spinach","No Vegetables","Other"]},
{q:"What other panini would you like us to offer?",type:"text"},
{q:"What other wrap would you like us to offer?",type:"text"},
{q:"Do you have any other suggestions for the LINKS sandwich shop?",type:"long"}
];
let i=0,answers=Array(questions.length).fill(null); const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active");window.scrollTo({top:0,behavior:"smooth"})}
function render(){const q=questions[i],a=answers[i];$("#progress").textContent="Question "+(i+1)+" of "+questions.length;let h='<h2 class="question">'+esc(q.q)+'</h2>';if(q.ingredients)h+='<div class="ingredients"><strong>'+(i===6?'Possible Ingredients:':'Ingredients:')+'</strong><ul>'+q.ingredients.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';if(q.type==="one")h+='<div class="choices">'+q.opts.map(o=>'<label class="choice"><input type="radio" name="answer" value="'+esc(o)+'" '+(a===o?"checked":"")+'> '+esc(o)+'</label>').join("")+'</div>';if(q.type==="multi")h+='<div class="choices">'+q.opts.map(o=>'<label class="choice"><input type="checkbox" value="'+esc(o)+'" '+(Array.isArray(a)&&a.includes(o)?"checked":"")+'> '+esc(o)+'</label>').join("")+'</div>';if(q.type==="text")h+='<input class="textinput" id="textAnswer" value="'+esc(a||"")+'" placeholder="Type your answer">';if(q.type==="long")h+='<textarea id="textAnswer" placeholder="Type your suggestions">'+esc(a||"")+'</textarea>';$("#questionBox").innerHTML=h;$("#back").classList.toggle("hidden",i===0);$("#next").textContent=i===questions.length-1?"Finish Survey":"Next →"}
function capture(){const q=questions[i];if(q.type==="one"){const x=document.querySelector('input[name="answer"]:checked');answers[i]=x?x.value:null} else if(q.type==="multi"){answers[i]=[...document.querySelectorAll('#questionBox input:checked')].map(x=>x.value)} else {answers[i]=($("#textAnswer")?.value||"").trim()}}
function valid(){const q=questions[i],a=answers[i];if(q.type==="one"&&!a){alert("Please choose an answer.");return false}if(q.type==="multi"&&(!a||!a.length)){alert("Please choose at least one answer.");return false}return true}
function graph(q,a){let counts=q.opts.map(o=>({o,n:q.type==="multi"?(Array.isArray(a)&&a.includes(o)?1:0):(a===o?1:0)})),max=1,rh=300/max,n=counts.length;let y='<span>1</span>';let bars=counts.map(x=>'<div class="barcol"><div class="cell" style="height:'+(x.n*rh)+'px"></div></div>').join("");return '<div class="graphCard"><div class="graphTitle">'+esc(q.q)+'</div><div class="scroll"><div class="graphWrap" style="--rh:'+rh+'px"><div class="ylabel"><span>Number of Responses</span></div><div class="yaxis" style="grid-template-rows:1fr">'+y+'</div><div class="plot" style="grid-template-columns:repeat('+n+',minmax(55px,1fr))">'+bars+'</div></div><div class="xlabels" style="grid-template-columns:repeat('+n+',minmax(55px,1fr))">'+counts.map(x=>'<div class="xlabel">'+esc(x.o)+'</div>').join("")+'</div><div class="axisTitle">Answer Choices</div></div></div>'}
function finish(){let graphs="",written="";questions.forEach((q,j)=>{if(q.opts)graphs+=graph(q,answers[j]);else written+='<div class="written"><strong>'+esc(q.q)+'</strong><p class="'+(!answers[j]?"empty":"")+'">'+esc(answers[j]||"No response")+'</p></div>'});$("#results").innerHTML=graphs;$("#written").innerHTML=written;show("done")}
$("#start").onclick=()=>{i=0;render();show("survey")};$("#back").onclick=()=>{capture();if(i>0){i--;render()}};$("#next").onclick=()=>{capture();if(!valid())return;if(i<questions.length-1){i++;render()}else finish()};$("#edit").onclick=()=>{i=questions.length-1;render();show("survey")};$("#restart").onclick=()=>{if(confirm("Clear all answers and start over?")){answers=Array(questions.length).fill(null);i=0;show("intro")}};$("#print").onclick=()=>{const sheet=$("#printSheet");sheet.innerHTML='<h1>Sandwich Press Survey — LINKS Sandwich Shop</h1>'+$("#results").innerHTML+'<h2>Written Responses</h2>'+$("#written").innerHTML;window.print()}
</script></body></html>
