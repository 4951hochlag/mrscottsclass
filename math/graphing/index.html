const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let S=null,T=$('#topic');Object.entries(TOPICS).forEach(([k,v])=>T.add(new Option(v[0],k)));
function opts(){return $('#options').value.split('\n').map(x=>x.trim()).filter(Boolean)}function topicChange(){let t=TOPICS[T.value];$('#customWrap').classList.toggle('hidden',T.value!=='custom');$('#options').value=t[1].join('\n');chips()}function chips(){$('#chips').innerHTML=opts().map(x=>'<span class="chip">'+esc(x)+'</span>').join('')}T.onchange=topicChange;$('#options').oninput=chips;topicChange();function toast(m){let e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function cfg(){let t=TOPICS[T.value],custom=$('#customTopic').value.trim(),pdf={};document.querySelectorAll('[data-pdf]').forEach(x=>pdf[x.dataset.pdf]=x.checked);return{topic:T.value==='custom'?(custom||'Class survey'):t[0],title:T.value==='custom'?custom||'Our Class Survey':t[2],x:T.value==='custom'?custom||'Response':t[3],y:'Number of Students',answers:opts(),size:Math.max(1,Math.min(40,+$('#classSize').value||20)),distribution:$('#distribution').value,portraits:$('#portraits').checked,predictionOn:$('#predictionOn').checked,questionsOn:$('#questionsOn').checked,difficulty:$('#qDifficulty').value,titleMode:$('#titleMode').value,axisMode:$('#axisMode').value,pdf}}
function create(){let c=cfg();if(!c.answers.length)return toast('Add at least one answer.');let blocked=$('#excluded').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),av=N.filter(x=>!blocked.includes(x.name.toLowerCase()));if(av.length<c.size)return toast('Too many names are excluded.');let f=shuffle(av.filter(x=>x.gender==='f')),m=shuffle(av.filter(x=>x.gender==='m')),fc=Math.floor(c.size/2)+(c.size%2&&Math.random()<.5?1:0),mc=c.size-fc;if(fc>f.length){mc+=fc-f.length;fc=f.length}if(mc>m.length){fc+=mc-m.length;mc=m.length}if(fc>20||mc>20)return toast('Exclude fewer names so portraits stay unique.');let people=shuffle([...f.slice(0,fc),...m.slice(0,mc)]),assigned=[];if(c.distribution==='balanced'){for(let i=0;i<c.size;i++)assigned.push(c.answers[i%c.answers.length]);shuffle(assigned)}else assigned=people.map(()=>c.answers[Math.floor(Math.random()*c.answers.length)]);let pp={f:shuffle([...P.f]),m:shuffle([...P.m])},students=people.map((p,i)=>({...p,answer:assigned[i],portrait:pp[p.gender].pop()})),actual=Object.fromEntries(c.answers.map(a=>[a,0]));students.forEach(x=>actual[x.answer]++);S={c,students,actual,revealed:0,prediction:'',graph:Object.fromEntries(c.answers.map(a=>[a,0])),graphChecked:false,graphCorrect:false,title:c.title,x:c.x,y:c.y,questions:[],responses:{},qChecked:false,studentName:'',stage:c.predictionOn?'predict':'collect'};save();show()}
function save(){if(S)sessionStorage.setItem('surveyActivity',JSON.stringify(S))}function show(){$('#setup').classList.remove('active');$('#setup').classList.add('hiddenPage');$('#activity').classList.add('active');$('#newTop').classList.remove('hidden');render()}function render(){steps();({predict,collect,graph,questions,finish}[S.stage])();save();scrollTo({top:0,behavior:'smooth'})}function steps(){let names=['Collect Data','Make a Graph',...(S.c.questionsOn?['Answer Questions']:[]),'Finished'],map={predict:0,collect:0,graph:1,questions:2,finish:names.length-1},cur=map[S.stage];$('#steps').innerHTML=names.map((n,i)=>'<div class="step '+(i===cur?'active':i<cur?'done':'')+'"><b>'+(i<cur?'✓':i+1)+'</b><span>'+n+'</span></div>'+(i<names.length-1?'<span>→</span>':'')).join('')}

function collect(){let done=S.revealed===S.students.length,s=S.revealed?S.students[S.revealed-1]:null,card=s?'<div class="profile">'+face(s)+'<div class="student"><div class="name">'+esc(s.name)+'</div><div class="answered">answered</div><div class="answer">'+esc(s.answer)+'</div></div></div>':'<div class="progress">Press “Reveal first student” when your class is ready.</div>';$('#work').innerHTML='<div class="top"><div><div class="topic">'+esc(S.c.topic)+'</div><div class="progress">'+(S.revealed?S.revealed+' of '+S.students.length+' revealed':S.students.length+' students ready')+'</div></div><button class="btn" id="teacher">Teacher setup</button></div><div class="reveal"><div class="card">'+card+'</div><aside class="tally side"><h3>Current tally</h3>'+tally()+'</aside></div><div class="center"><button class="btn mobile" id="showTally">Show tally</button><button class="btn primary" id="reveal" '+(done?'disabled':'')+'>'+(S.revealed===0?'Reveal first student':done?'All students revealed':'Next student')+'</button>'+(done?'<button class="btn primary" id="toGraph">Make the graph →</button>':'')+'<button class="btn" id="present">Presentation mode</button></div><aside class="tally overlay" id="overlay"><h3>Current tally</h3>'+tally()+'<button class="btn primary" id="close">Close</button></aside>';$('#reveal').onclick=()=>{if(!done){S.revealed++;collect();save()}};$('#showTally')?.addEventListener('click',()=>$('#overlay').classList.add('show'));$('#close').onclick=()=>$('#overlay').classList.remove('show');$('#present').onclick=()=>{document.body.classList.add('presentation');document.documentElement.requestFullscreen?.().catch(()=>{});};$('#teacher').onclick=()=>{if(confirm('Return to Teacher Setup? Current work remains saved unless you create a new class.')){$('#activity').classList.remove('active');$('#setup').classList.remove('hiddenPage');$('#setup').classList.add('active');document.body.classList.remove('presentation');document.exitFullscreen?.().catch(()=>{})}};i const colors={Red:'#ef4444',Yellow:'#eab308',Blue:'#3b82f6',Purple:'#8b5cf6',Green:'#22c55e',Orange:'#f97316',Pink:'#ec4899',Other:'#64748b'};function capture(){if($('#gt'))S.title=$('#gt').value;if($('#gx'))S.x=$('#gx').value;if($('#gy'))S.y=$('#gy').value}
function graph(){let max=Math.max(5,...Object.values(S.actual)),h=Math.max(320,Math.min(560,max*42)),rh=h/max,n=S.c.answers.length,title=S.c.titleMode==='supplied'?'<div class="field"><span class="label">Graph title</span><strong>'+esc(S.title)+'</strong></div>':'<div class="field"><label>Graph title</label><input id="gt" value="'+esc(S.title===S.c.title?'':S.title)+'" placeholder="Type a title"></div>',axes=S.c.axisMode==='supplied'?'<div class="field"><span class="label">Horizontal axis</span><strong>'+esc(S.x)+'</strong></div><div class="field"><span class="label">Vertical axis</span><strong>'+esc(S.y)+'</strong></div>':'<div class="field"><label>Horizontal axis</label><input id="gx" value="'+esc(S.x===S.c.x?'':S.x)+'" placeholder="What are the categories?"></div><div class="field"><label>Vertical axis</label><input id="gy" value="'+esc(S.y===S.c.y?'':S.y)+'" placeholder="What is counted?"></div>',y=Array.from({length:max},(_,i)=>'<span>'+(max-i)+'</span>').join(''),bars=S.c.answers.map(a=>'<div class="barcol" style="--bar:'+(colors[a]||'#2563eb')+'">'+Array.from({length:max},(_,i)=>{let v=i+1,cl=S.graph[a]>=v?'on':'';return'<button class="cell '+cl+'" data-cat="'+esc(a)+'" data-v="'+v+'" aria-label="Set '+esc(a)+' bar to '+v+'"></button>'}).join('')+'</div>').join('');let titleSlot=S.c.titleMode==='supplied'?'<div class="graph-title-slot">'+esc(S.title)+'</div>':'<div class="graph-title-slot"><input id="gt" value="'+esc(S.title===S.c.title?'':S.title)+'" placeholder="Type graph title" aria-label="Graph title"></div>',ySlot=S.c.axisMode==='supplied'?'<div class="y-axis-title"><span>'+esc(S.y)+'</span></div>':'<div class="y-axis-title"><input id="gy" value="'+esc(S.y===S.c.y?'':S.y)+'" placeholder="Y-axis label" aria-label="Vertical axis label"></div>',xSlot=S.c.axisMode==='supplied'?'<div class="axis">'+esc(S.x)+'</div>':'<div class="axis"><input id="gx" value="'+esc(S.x===S.c.x?'':S.x)+'" placeholder="X-axis label" aria-label="Horizontal axis label"></div>';$('#work').innerHTML='<div class="top"><div><div class="topic">Make a Bar Graph</div><div class="progress">Tap blocks to build each bar. Tap again to fix a mistake.</div></div><button class="btn" id="backData">← Data</button></div><div class="scroll" style="--gh:'+h+'px;--rh:'+rh+'px">'+titleSlot+'<div class="graph-body">'+ySlot+'<div class="graph-wrap"><div class="graph"><div class="yaxis" style="grid-template-rows:repeat('+max+',1fr)">'+y+'</div><div class="plot" style="grid-template-columns:repeat('+n+',minmax(62px,1fr))">'+bars+'</div></div><div class="xlabels" style="grid-template-columns:repeat('+n+',minmax(62px,1fr))">'+S.c.answers.map(a=>'<div class="xlabel">'+esc(a)+'</div>').join('')+'</div>'+xSlot+'</div></div></div><div class="feedback"></div><div class="center"><button class="btn danger" id="clear">Clear Graph</button><button class="btn primary" id="checkGraph">Check My Graph</button>'+(S.graphCorrect?'<button class="btn primary" id="after">'+(S.c.questionsOn?'Answer Questions':'Finish')+' →</button>':'')+'</div>';document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{capture();let a=b.dataset.cat,v=+b.dataset.v;S.graph[a]=S.graph[a]>=v?v-1:v;S.graphChecked=S.graphCorrect=false;graph();save()});['gt','gx','gy'].forEach(id=>$('#'+id)?.addEventListener('input',capture));$('#clear').onclick=()=>{S.c.answers.forEach(a=>S.graph[a]=0);S.graphChecked=S.graphCorrect=false;graph()};$('#checkGraph').onclick=()=>{capture();if((S.c.titleMode==='student'&&!S.title.trim())||(S.c.axisMode==='student'&&(!S.x.trim()||!S.y.trim())))return toast('Complete the title and axis labels.');S.graphChecked=true;S.graphCorrect=S.c.answers.every(a=>S.graph[a]===S.actual[a]);graph();showGraphCheckPopup(S.graphCorrect)};$('#backData').onclick=()=>{S.stage='collect';render()};if(S.graphCorrect)$('#after').onclick=()=>{S.stage=S.c.questionsOn?'questions':'finish';if(!S.questions.length)S.questions=makeQuestions();render()}}
function showGraphCheckPopup(ok){let old=document.getElementById('graphCheckPop');if(old)old.remove();let pop=document.createElement('div');pop.id='graphCheckPop';pop.className='check-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-modal','true');pop.innerHTML='<div class="check-box '+(ok?'good':'bad')+'"><div class="check-icon">'+(ok?'✓':'✕')+'</div><h2>'+(ok?'Great work!':'Not quite yet')+'</h2><p>'+(ok?'Every bar matches the survey data.':'Some bars do not match the survey data. Check your graph and try again.')+'</p><button class="btn" id="graphCheckOK">OK</button></div>';document.body.appendChild(pop);document.getElementById('graphCheckOK').onclick=()=>{pop.remove();document.getElementById('checkGraph')?.focus()};document.getElementById('graphCheckOK').focus()}function extreme(type){let v=type==='max'?Math.max(...Object.values(S.actual)):Math.min(...Object.values(S.actual));return S.c.answers.filter(a=>S.actual[a]===v)}function makeQuestions(){let pick=S.c.answers[Math.floor(Math.random()*S.c.answers.length)],q=[{type:'multi',text:'Which category was the most popular?',correct:extreme('max')},{type:'multi',text:'Which category was the least popular?',correct:extreme('min')},{type:'number',text:'How many students chose '+pick+'?',correct:S.actual[pick]},{type:'number',text:'How many students were surveyed altogether?',correct:S.students.length}];if(S.c.difficulty==='mixed'&&S.c.answers.length>1){let a=[...S.c.answers].sort((x,y)=>S.actual[y]-S.actual[x]||x.localeCompare(y)),hi=a[0],lo=a.at(-1),b=a[1]||lo;q.push({type:'number',text:'How many more students chose '+hi+' than '+lo+'?',correct:S.actual[hi]-S.actual[lo]},{type:'number',text:'How many fewer students chose '+lo+' than '+hi+'?',correct:S.actual[hi]-S.actual[lo]},{type:'number',text:'How many students chose either '+hi+' or '+b+'?',correct:S.actual[hi]+S.actual[b]})}return q}function right(q,a){return q.type==='number'?Number(a)===q.correct:Array.isArray(a)&&a.length===q.correct.length&&q.co function questions(){if(!S.questions.length)S.questions=makeQuestions();let all=S.qChecked&&S.questions.every((q,i)=>right(q,S.responses[i]));$('#work').innerHTML='<div class="top"><div><div class="topic">Answer Questions</div><div class="progress">Use your graph to help you.</div></div><button class="btn" id="backGraph">← Graph</button></div>'+S.questions.map((q,i)=>{let a=S.responses[i],control=q.type==='multi'?'<div class="choices">'+S.c.answers.map(x=>'<button class="qchoice '+((a||[]).includes(x)?'selected':'')+'" data-qi="'+i+'" data-choice="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>':'<input class="number" type="number" min="0" inputmode="numeric" data-num="'+i+'" value="'+(a??'')+'">',result=S.qChecked?'<div class="qresult '+(right(q,a)?'ok':'no')+'">'+(right(q,a)?'✓ Nice work!':'Have another look at the graph.')+'</div>':'';return'<div class="question"><h3>'+(i+1)+'. '+esc(q.text)+(q.type==='multi'&&q.correct.length>1?' Select all that apply.':'')+'</h3>'+control+result+'</div>'}).join('')+'<div class="center"><button class="btn primary" id="checkQ">Check My Answers</button>'+(all?'<button class="btn primary" id="done">Finish →</button>':'')+'</div>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let i=+b.dataset.qi,a=b.dataset.choice,l=S.responses[i]||[];S.responses[i]=l.includes(a)?l.filter(x=>x!==a):[...l,a];S.qChecked=false;questions()});document.querySelectorAll('[data-num]').forEach(x=>x.oninput=()=>{S.responses[+x.dataset.num]=x.value===''?'':+x.value;S.qChecked=false;save()});$('#checkQ').onclick=()=>{S.qChecked=true;questions()};$('#backGraph').onclick=()=>{S.stage='graph';render()};if(all)$('#done').onclick=()=>{S.stage='finish';render()}}
function finish(){let top=extreme('max'),matched=S.prediction&&top.includes(S.prediction),pred=S.c.predictionOn?'<div class="result"><strong>Your prediction:</strong> '+esc(S.prediction)+'<br>'+(matched?'It matched a most-popular answer!':'The most popular '+(top.length>1?'answers were ':'answer was ')+esc(top.join(' and '))+'. Predictions help us think before collecting data.')+'</div>':'';$('#work').innerHTML='<div class="finish"><div style="font-size:4rem">✓</div><h2>Activity complete!</h2><p>You collected data, made a graph, and '+(S.c.questionsOn?'answered questions about it.':'showed the results.')+'</p>'+pred+'<div class="summary"><div><strong>Survey</strong>'+esc(S.c.topic)+'</div><div><strong>Students</strong>'+S.students.length+'</div><div><strong>Scale</strong>1 block = 1 student</div></div><div class="field"><label>Student name for PDF</label><input id="studentName" value="'+esc(S.studentName)+'" placeholder="Enter your name"></div><div class="center"><button class="btn" id="backLast">← Back</button><button class="btn primary" id="pdf">Save My Work as PDF</button><button class="btn danger" id="newSurvey">Start a New Survey</button></div></div>';$('#studentName').oninput=e=>{S.studentName=e.target.value;save()};$('#backLast').onclick=()=>{S.stage=S.c.questionsOn?'questions':'graph';render()};$('#pdf').onclick=downloadPDF;$('#newSurvey').onclick=newSurvey}
function newSurvey(){if(!confirm('Start a completely new survey? This will delete the current student work.'))return;S=null;sessionStorage.removeItem('surveyActivity');$('#activity').classList.remove('active');$('#setup').classList.remove('hiddenPage');$('#setup').classList.add('active');$('#newTop').classList.add('hidden');document.body.classList.remove('presentation');document.exitFullscreen?.().catch(()=>{})}$('#newTop').onclick=newSurvey;$('#create').onclick=()=>{if(S&&!confirm('Create a new class and replace the current work?'))return;create()};
function pe(s){return String(s??'').replace(/[^\x20-\x7E]/g,'').replace(/([\\()])/g,'\\$1')}function downloadPDF(){let L=[],add=(t,z=11,b=false)=>L.push({t,z,b});add(S.title,19,true);add('Student: '+(S.studentName||'____________________')+'    Date: '+new Date().toLocaleDateString());add('Survey topic: '+S.c.topic,12,true);if(S.c.pdf.prediction&&S.c.predictionOn)add('Prediction: '+S.prediction);if(S.c.pdf.tally){add('Data results',14,true);S.c.answers.forEach(a=>add(a+': '+S.actual[a]+' student'+(S.actual[a]===1?'':'s')))}if(S.c.pdf.graph){add('Completed bar graph',14,true);add(S.y+' by '+S.x);S.c.answers.forEach(a=>add(a+' | '+'#'.repeat(Math.min(30,S.graph[a]))+' '+S.graph[a]))}if(S.c.pdf.questions&&S.c.questionsOn){add('Graph questions',14,true);S.questions.forEach((q,i)=>{let a=S.responses[i];add((i+1)+'. '+q.text);add('Answer: '+(Array.isArray(a)?a.join(', '):(a??'')),10)})}if(S.c.pdf.feedback){add('Graph: '+(S.graphCorrect?'Correct':'Not yet correct'));if(S.c.questionsOn)add('Questions correct: '+S.questions.filter((q,i)=>right(q,S.responses[i])).length+' of '+S.questions.length)}pdf(L)}
function pdf(lines){let pages=[],page=[],y=750;for(let l of lines){let chunks=[''];for(let w of l.t.split(' ')){let j=chunks.length-1;if((chunks[j]+' '+w).length>82)chunks.push(w);else chunks[j]+=(chunks[j]?' ':'')+w}for(let t of chunks){if(y<55){pages.push(page);page=[];y=750}page.push({...l,t,y});y-=l.z*1.55}y-=l.z*.3}pages.push(page);let O=['<< /Type /Catalog /Pages 2 0 R >>','PAGES','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'],kids=[];pages.forEach((p,i)=>{let pn=5+i*2,cn=pn+1,k='BT\n';kids.push(pn+' 0 R');p.forEach(l=>k+='/'+(l.b?'F2':'F1')+' '+l.z+' Tf 1 0 0 1 50 '+l.y+' Tm ('+pe(l.t)+') Tj\n');k+='ET';O[pn-1]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+cn+' 0 R >>';O[cn-1]='<< /Length '+k.length+' >>\nstream\n'+k+'\nendstream'});O[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>';let out='%PDF-1.4\n',off=[0];O.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let xr=out.length;out+='xref\n0 '+(O.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<=O.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';out+='trailer\n<< /Size '+(O.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download=(S.studentName||'student').replace(/[^a-z0-9]+/gi,'_')+'_survey_work.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
