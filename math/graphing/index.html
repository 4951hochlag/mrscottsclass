#studentPdfSheet{display:none}@media print{body>*:not(#studentPdfSheet){display:none!important}#studentPdfSheet{display:block!important;background:#fff;color:#111;padding:10px 14px;font-family:Arial,sans-serif}#studentPdfSheet h1{text-align:center;margin:0 0 6px;font-size:22px}#studentPdfSheet h2{margin:14px 0 7px;font-size:16px}.pdfMeta{text-align:center;margin-bottom:14px}.pdfResults{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 20px}.pdfQ{margin:7px 0;break-inside:avoid}.pdfGraphImage{display:block;width:100%;max-width:720px;height:auto;margin:4px auto 10px;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:letter;margin:.4in}}</style></head><body><main class="app"><header><div class="brand"><div class="logo">▥</div><div><h1>One at a Time</h1><div class="sub">Class survey and graph activity</div></div></div><button class="btn hidden" id="newTop">New survey</button></header>
<section class="screen setup active" id="setup"><div class="panel"><h2>1. Choose the survey</h2><div class="field"><label>Topic</label><select id="topic"></select></div><div class="field hidden" id="customWrap"><label>Question or topic</label><input id="customTopic" placeholder="e.g., Favourite way to travel"></div><div class="field"><label>Possible answers · one per line</label><textarea id="options"></textarea><div class="hint">Edit this list for any lesson.</div></div><div class="chips" id="chips"></div><h2 style="margin-top:24px">2. Create the class</h2><div class="row"><div class="field"><label>Number of students</label><input id="classSize" type="number" min="1" max="40" value="20"></div><div class="field"><label>Answers</label><select id="distribution"><option value="random">Random</option><option value="balanced">Balanced</option></select></div></div><div class="field"><label>Names to avoid · separated by commas</label><textarea id="excluded"></textarea></div><div class="checks"><label><input type="checkbox" id="portraits" checked>Show imaginary student portraits</label></div><div class="note">Presentation mode hides all teacher setup information.</div></div>
<div class="panel"><h2>3. Set the learning activity</h2><div class="checks"><label><input type="checkbox" id="predictionOn" checked>Ask for a prediction</label><label><input type="checkbox" id="questionsOn" checked>Include graph questions</label></div><div class="field"><label>Question difficulty</label><select id="qDifficulty"><option value="basic">Basic</option><option value="mixed">Basic + comparison</option></select></div><div class="field"><label>Graph title</label><select id="titleMode"><option value="supplied">Supply the title</option><option value="student">Student enters the title</option></select></div><div class="field"><label>Axis labels</label><select id="axisMode"><option value="supplied">Supply axis labels</option><option value="student">Student enters the labels</option></select></div><div class="field"><label>Graph scale</label><select id="scale"><option>1 block = 1 student</option></select><div class="hint">Ready for more scales in a future version.</div></div><h2 style="margin-top:24px">4. Student PDF</h2><div class="checks" id="pdfChecks"><label><input type="checkbox" data-pdf="prediction" checked>Prediction</label><label><input type="checkbox" data-pdf="tally" checked>Data and tally results</label><label><input type="checkbox" data-pdf="graph" checked>Graph and labels</label><label><input type="checkbox" data-pdf="questions" checked>Questions and answers</label><label><input type="checkbox" data-pdf="feedback">Results and feedback</label></div><div class="actions"><button class="btn primary" id="create">Create class &amp; begin</button></div></div></section>
<section class="screen" id="activity"><nav class="steps" id="steps"></nav><section class="work" id="work"></section></section></main><div class="toast" id="toast" role="status"></div><script src="app.js?v=20260922-1"></script></body></html>
