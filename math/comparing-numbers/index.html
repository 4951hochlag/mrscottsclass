<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparing Numbers | Mr. Scott's Class</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#17243c;font-family:Arial,sans-serif}main{max-width:820px;margin:24px auto;padding:18px}a{color:#244b93}h1{text-align:center;font-size:clamp(2rem,5vw,3rem)}.panel{background:white;border:2px solid #dfe6f3;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 4px 14px #17243c10}label{font-weight:bold}select,button{font:inherit;padding:12px;border-radius:12px;border:2px solid #a8b8d0;background:white;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffae38}button{font-weight:bold}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.numbers{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(1.8rem,7vw,5.2rem);font-weight:bold;margin:28px 0}.blank{color:#9caac1}.choices{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.choices button{font-size:3rem;min-width:100px;min-height:85px;background:#eef4ff}.choices button:hover{background:#dbe9ff}.choices button:disabled{opacity:.55;cursor:default}.feedback{text-align:center;font-size:1.3rem;font-weight:bold;min-height:2em;margin-top:18px}.stats{text-align:center;font-size:1.15rem}.next{display:block;margin:18px auto;background:#2454a6;color:white;border-color:#2454a6}.next:disabled{opacity:.5}.help{line-height:1.8}small{color:#54647c}</style></head><body><main><a href="../">← Back to Math</a><h1>Comparing Numbers</h1><div class="panel help"><strong>Choose the correct symbol:</strong><div><strong>&lt;</strong> means less than · <strong>&gt;</strong> means greater than · <strong>=</strong> means equal to</div><small>Example: 3 &lt; 7 because 3 is smaller than 7.</small></div><div class="panel"><div class="controls"><label for="mode">Compare:</label><select id="mode"><option value="numbers">Numbers</option><option value="money">Money ($)</option></select><label for="range">Value range:</label><select id="range"><option value="10">0–10</option><option value="20">0–20</option><option value="100" selected>0–100</option><option value="1000">0–1,000</option></select><button id="restart">Start Over</button></div><p class="stats" id="stats" aria-live="polite">Question 1 · Correct: 0 / 0</p><div class="numbers"><span id="left">4</span><span class="blank" id="middle">?</span><span id="right">8</span></div><div class="choices" aria-label="Choose a comparison symbol"><button data-symbol="<" aria-label="Less than">&lt;</button><button data-symbol=">" aria-label="Greater than">&gt;</button><button data-symbol="=" aria-label="Equal to">=</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="next" id="next" disabled>Next Question →</button><button class="next" id="sendTeacher" type="button" disabled>Send to Teacher</button><p id="sendNote" class="stats">Complete at least 5 questions before sending.</p></div></main><script>const $=id=>document.getElementById(id);let a,b,correct=0,answered=0,locked=false,previous='',hadMistake=false,attempts=0;const completedRounds=[];const submissionKey='mrscottComparingNumbersSubmissionCount';const submissionCount=()=>Math.min(3,Math.max(0,Number(sessionStorage.getItem(submissionKey))||0));function updateSend(){const n=completedRounds.length,c=submissionCount();$('sendTeacher').disabled=n<5||c>=3;$('sendNote').textContent=c>=3?'Submission limit reached (3 of 3 this session).':n<5?'Complete '+(5-n)+' more question(s) before sending.':n+' questions completed · '+c+' of 3 submissions used.';}const money=()=> $('mode').value==='money';const format=n=>money()?'$'+(n/100).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}):n.toLocaleString('en-CA');const buttons=[...document.querySelectorAll('[data-symbol]')];function random(max){return Math.floor(Math.random()*(max+1))}function question(){const max=Number($('range').value)*(money()?100:1);let key,attempt=0;do{a=random(max);b=Math.random()<.25?a:random(max);key=$('mode').value+':'+a+','+b;attempt++}while(key===previous&&attempt<30);previous=key;locked=false;hadMistake=false;attempts=0;$('left').textContent=format(a);$('right').textContent=format(b);$('middle').textContent='?';$('feedback').textContent='';$('next').disabled=true;buttons.forEach(x=>x.disabled=false);stats()}function stats(){$('stats').textContent='Question '+(answered+1)+' · Correct on first try: '+correct+' / '+answered}function choose(symbol){if(locked)return;const expected=a<b?'<':a>b?'>':'=';const good=symbol===expected;attempts++;$('middle').textContent=symbol;$('middle').style.color=good?'#147b43':'#b53434';$('feedback').style.color=good?'#147b43':'#b53434';if(!good){hadMistake=true;$('feedback').textContent='Not quite. Try again!';return;}locked=true;answered++;if(!hadMistake)correct++;completedRounds.push({left:format(a),right:format(b),symbol:expected,mode:$('mode').value,range:$('range').value,attempts,firstTry:!hadMistake});updateSend();$('feedback').textContent=hadMistake?'✓ Correct! You got it!':'✓ Correct!';buttons.forEach(x=>x.disabled=true);$('next').disabled=false;$('stats').textContent='Answered: '+answered+' · Correct on first try: '+correct+' · First-try accuracy: '+Math.round(correct/answered*100)+'%'} buttons.forEach(x=>x.addEventListener('click',()=>choose(x.dataset.symbol)));$('next').addEventListener('click',question);$('restart').addEventListener('click',()=>{answered=0;correct=0;previous='';completedRounds.length=0;updateSend();question()});$('range').addEventListener('change',()=>{answered=0;correct=0;previous='';completedRounds.length=0;updateSend();question()});$('mode').addEventListener('change',()=>{answered=0;correct=0;previous='';completedRounds.length=0;updateSend();question()});question();updateSend();</script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="../../shared/send-to-teacher.js?v=20261028comparing"></script><script>
async function comparingNumbersPdf(){
if(completedRounds.length<5)throw Error('Complete at least five questions first.');
if(!window.jspdf?.jsPDF)throw Error('PDF library did not load.');
const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),margin=18;
pdf.setFont('helvetica','bold');pdf.setFontSize(17);pdf.text('Comparing Numbers',margin,22);
pdf.setFont('helvetica','normal');pdf.setFontSize(11);
pdf.text('Questions completed: '+completedRounds.length+' | Correct on first try: '+correct,margin,32);
let y=46;
completedRounds.forEach((q,i)=>{if(y>265){pdf.addPage();y=22;}pdf.setFont('helvetica','bold');pdf.text('Question '+(i+1)+' - '+(q.mode==='money'?'Money':'Numbers')+' (0-'+q.range+')',margin,y);y+=7;pdf.setFont('helvetica','normal');pdf.text(q.left+'  '+q.symbol+'  '+q.right,margin,y);y+=6;pdf.text('Attempts: '+q.attempts+' | '+(q.firstTry?'Correct on first try':'Correct after retry'),margin,y);y+=12;});
return pdf.output('datauristring');
}
if(window.MrScottSendToTeacher){MrScottSendToTeacher.mount({button:'#sendTeacher',activity:'Comparing Numbers',getPdfBase64:comparingNumbersPdf,beforeSend:()=>{const c=submissionCount();if(completedRounds.length<5){alert('Complete at least five questions before sending.');return false;}if(c>=3){alert('You have already sent your work three times this session.');updateSend();return false;}if(c>=1)return confirm('You have already submitted '+c+' time(s) this session. Send again? You have '+(3-c)+' submission(s) remaining.');return true;},onSuccess:()=>{sessionStorage.setItem(submissionKey,String(submissionCount()+1));updateSend();}});}
</script></body></html>
