<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Picture Sentences | Mr. Scott's Class</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;text-align:center;padding:22px;border-bottom:1px solid #dde3ed}h1{margin:0;font-size:clamp(2rem,6vw,3.3rem)}main{width:min(1000px,94%);margin:24px auto}.back{color:#263b65;font-weight:700;text-decoration:none}.card{background:#fff;border:2px solid #e1e6ef;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 15px #17203312}.setup h2,.card h2{text-align:center}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.choice{border:3px solid #cfd7e6;background:#fff;border-radius:16px;padding:16px;font-size:1.05rem;font-weight:700;cursor:pointer}.choice.on{border-color:#3559a8;background:#edf3ff}.start,.primary,.next,.pdf{border:0;border-radius:14px;padding:14px 22px;font-size:1.05rem;font-weight:800;cursor:pointer;background:#244d9b;color:white}.start{display:block;margin:22px auto 0}.topline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700;color:#526078}.picture{display:block;max-width:100%;max-height:390px;margin:18px auto;border-radius:16px}.prompt{text-align:center;font-size:1.25rem;font-weight:800}.sentence{min-height:72px;border:3px dashed #b7c2d4;border-radius:16px;padding:14px;margin:16px 0;font-size:1.35rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bank{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.word{display:flex;align-items:center;gap:6px;background:#eef3ff;border:2px solid #aebfe6;border-radius:12px;padding:10px 12px;font-size:1.15rem;font-weight:700;cursor:pointer}.speak{border:0;background:#fff;border-radius:50%;font-size:1.1rem;cursor:pointer;padding:4px 7px}.textentry{width:100%;font-size:1.35rem;padding:14px;border:2px solid #aeb8c8;border-radius:14px}.keywords{text-align:center;font-size:1.15rem;margin:12px}.feedback{text-align:center;font-size:1.2rem;font-weight:800;min-height:32px;margin:14px}.good{color:#16723a}.bad{color:#a72b2b}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.secondary{background:#e9edf5;color:#24324d;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}.hidden{display:none!important}.report h2{text-align:center}.report-item{page-break-inside:avoid;border-top:2px solid #ddd;padding:18px 0}.report-item img{max-width:280px;max-height:220px;display:block;margin:8px auto}.attempt{margin:6px 0}.note{color:#5a667b;text-align:center}.progress{height:12px;background:#e5e9f1;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#3559a8}.finish{text-align:center}
@media(max-width:600px){.card{padding:16px}.picture{max-height:300px}.word{font-size:1rem}}
@media print{body{background:#fff}header,.back,.no-print,#setup,#activity,#finishControls{display:none!important}main{width:100%;margin:0}.card{border:0;box-shadow:none}.report{display:block!important}.report-item{page-break-inside:avoid}.report-item img{max-width:240px;max-height:180px}}
</style></head><body><header><h1>Picture Sentences</h1></header><main><a class="back no-print" href="../">← Back to English</a>
<section id="setup" class="card setup"><h2>Choose an activity</h2><p class="note">Pick a level and a picture set. Each set has 6 pictures.</p><h3>Level</h3><div id="levels" class="choices">
<button class="choice" data-level="1">Level 1<br><small>Build with words + audio</small></button><button class="choice" data-level="2">Level 2<br><small>Put words in order</small></button><button class="choice" data-level="3">Level 3<br><small>Write with keywords</small></button><button class="choice" data-level="4">Level 4<br><small>Write from the picture</small></button></div>
<h3>Picture Set</h3><div id="sets" class="choices"><button class="choice" data-set="1">Set 1</button><button class="choice" data-set="2">Set 2</button><button class="choice" data-set="3">Set 3</button><button class="choice" data-set="4">Set 4</button><button class="choice" data-set="5">Set 5</button><button class="choice" data-set="6">Set 6</button><button class="choice" data-set="7">Set 7</button></div><button id="start" class="start">Start</button></section>
<section id="activity" class="card hidden"><div class="topline"><span id="levelLabel"></span><span id="counter"></span></div><div class="progress"><span id="bar"></span></div><img id="pic" class="picture" alt="Picture for sentence writing"><p id="prompt" class="prompt"></p><div id="keywords" class="keywords hidden"></div><div id="sentence" class="sentence hidden"></div><div id="bank" class="bank hidden"></div><textarea id="entry" class="textentry hidden" rows="3" placeholder="Write your sentence here."></textarea><div id="feedback" class="feedback"></div><div class="actions"><button id="clear" class="secondary hidden">Start over</button><button id="check" class="primary">Check</button><button id="next" class="next hidden">Next picture</button></div></section>
<section id="finish" class="card finish hidden"><h2>Great work!</h2><p>You finished this picture set.</p><div id="finishControls" class="actions"><button id="showReport" class="secondary">See my work</button><button id="printPdf" class="pdf">Save as PDF</button><button id="again" class="primary">Choose another activity</button></div></section>
<section id="report" class="card report hidden"><h2>My Picture Sentences</h2><p id="reportInfo" class="note"></p><div id="reportBody"></div></section></main>
<script>
const ALL=[{"set":1,"img":1,"s":"The woman is walking her dog.","k":["woman","walks","dog"]},{"set":1,"img":2,"s":"The boy is jumping over a puddle.","k":["boy","jumps","puddle"]},{"set":1,"img":3,"s":"The men are eating pizza.","k":["men","eat","pizza"]},{"set":1,"img":4,"s":"The woman is listening to music.","k":["woman","listens","music"]},{"set":1,"img":5,"s":"The boys are fighting.","k":["boys","fighting"]},{"set":1,"img":6,"s":"The man is slipping in a puddle.","k":["man","slips","puddle"]},{"set":2,"img":1,"s":"The boy is building a sandcastle.","k":["boy","builds","sandcastle"]},{"set":2,"img":2,"s":"The child is riding a bike.","k":["child","rides","bike"]},{"set":2,"img":3,"s":"The cat is sleeping on a pillow.","k":["cat","sleeps","pillow"]},{"set":2,"img":4,"s":"The woman is cooking food.","k":["woman","cooks","food"]},{"set":2,"img":5,"s":"The man is reading a book.","k":["man","reads","book"]},{"set":2,"img":6,"s":"The bird is flying in the sky.","k":["bird","flies","sky"]},{"set":3,"img":1,"s":"The baby is eating food.","k":["baby","eats","food"]},{"set":3,"img":2,"s":"The dog is running with a ball.","k":["dog","runs","ball"]},{"set":3,"img":3,"s":"The woman is writing in a notebook.","k":["woman","writes","notebook"]},{"set":3,"img":4,"s":"The monkey is hanging from a branch.","k":["monkey","hangs","branch"]},{"set":3,"img":5,"s":"The man is laughing.","k":["man","laughs"]},{"set":3,"img":6,"s":"The family is ice skating.","k":["family","ice skating"]},{"set":4,"img":1,"s":"The boy is playing basketball.","k":["boy","plays","basketball"]},{"set":4,"img":2,"s":"The people are running.","k":["people","running"]},{"set":4,"img":3,"s":"The man is waving hello.","k":["man","waves","hello"]},{"set":4,"img":4,"s":"The couple is dancing together.","k":["couple","dances"]},{"set":4,"img":5,"s":"The man is playing chess.","k":["man","plays","chess"]},{"set":4,"img":6,"s":"The women are laughing together.","k":["women","laugh"]},{"set":5,"img":1,"s":"The girl is playing the piano.","k":["girl","plays","piano"]},{"set":5,"img":2,"s":"The people are painting the wall.","k":["people","paint","wall"]},{"set":5,"img":3,"s":"The people are exercising together.","k":["people","exercise"]},{"set":5,"img":4,"s":"The girl is doing a puzzle.","k":["girl","puzzle"]},{"set":5,"img":5,"s":"The man is pointing at you.","k":["man","points"]},{"set":5,"img":6,"s":"The woman is driving a car.","k":["woman","drives","car"]},{"set":6,"img":1,"s":"The boy is sleeping at his desk.","k":["boy","sleeps","desk"]},{"set":6,"img":2,"s":"The family is shopping for groceries.","k":["family","shops","groceries"]},{"set":6,"img":3,"s":"The boy is watching a video.","k":["boy","watches","video"]},{"set":6,"img":4,"s":"The boy is building with blocks.","k":["boy","builds","blocks"]},{"set":6,"img":5,"s":"The man is using his phone while driving.","k":["man","phone","driving"]},{"set":6,"img":6,"s":"The woman is talking to the boy.","k":["woman","talks","boy"]},{"set":7,"img":1,"s":"The people are playing a board game.","k":["people","play","board game"]},{"set":7,"img":2,"s":"The couple is eating a meal.","k":["couple","eats","meal"]},{"set":7,"img":3,"s":"The runners are racing on the track.","k":["runners","race","track"]},{"set":7,"img":4,"s":"The girl is holding a piglet.","k":["girl","holds","piglet"]},{"set":7,"img":5,"s":"The girl is writing in her notebook.","k":["girl","writes","notebook"]},{"set":7,"img":6,"s":"The bird is singing on a branch.","k":["bird","sings","branch"]}];
let level=null,setNo=null,items=[],idx=0,attempts=[],chosen=[];
const $=id=>document.getElementById(id);
document.querySelectorAll('#levels .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#levels .choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');level=+b.dataset.level});
document.querySelectorAll('#sets .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sets .choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');setNo=+b.dataset.set});
$('start').onclick=()=>{if(!level||!setNo){alert('Please choose a level and a picture set.');return}items=ALL.filter(x=>x.set===setNo);idx=0;attempts=items.map(()=>[]);$('setup').classList.add('hidden');$('activity').classList.remove('hidden');render()};
function imgPath(x){return 'images/activity_'+x.set+'_image_'+String(x.img).padStart(2,'0')+'.jpg'}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function words(s,includePeriod=false){const base=s.replace(/[.?!]/g,'').split(/\s+/);return includePeriod?[...base,'.']:base}
function render(){const x=items[idx];chosen=[];$('levelLabel').textContent='Level '+level+' • Set '+setNo;$('counter').textContent='Picture '+(idx+1)+' of '+items.length;$('bar').style.width=((idx)/items.length*100)+'%';$('pic').src=imgPath(x);$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.add('hidden');$('check').classList.remove('hidden');$('entry').value='';$('sentence').innerHTML='';$('bank').innerHTML='';$('keywords').classList.add('hidden');$('sentence').classList.add('hidden');$('bank').classList.add('hidden');$('entry').classList.add('hidden');$('clear').classList.add('hidden');
if(level===1||level===2){$('prompt').textContent=level===1?'Build the sentence. Tap the speaker to hear a word.':'Put the words in the correct order.';$('sentence').classList.remove('hidden');$('bank').classList.remove('hidden');$('clear').classList.remove('hidden');shuffle(words(x.s,level===1)).forEach((w,i)=>addWord(w,i,level===1))}
else{$('prompt').textContent='Write one sentence about the picture.';$('entry').classList.remove('hidden');if(level===3){$('keywords').classList.remove('hidden');$('keywords').innerHTML='<strong>Keywords:</strong> '+x.k.join(' • ')}}}
function addWord(w,i,audio){const b=document.createElement('button');b.className='word';b.dataset.word=w;b.innerHTML='<span>'+w+'</span>'+(audio?'<span class="speak" title="Hear word">🔊</span>':'');b.onclick=e=>{if(audio&&e.target.classList.contains('speak')){e.stopPropagation();speak(w);return}chosen.push(w);b.remove();drawChosen()};$('bank').appendChild(b)}
function drawChosen(){$('sentence').innerHTML='';chosen.forEach((w,i)=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{chosen.splice(i,1);renderBankFromState();drawChosen()};$('sentence').appendChild(b)})}
function renderBankFromState(){const x=items[idx],all=words(x.s,level===1),left=[...all];chosen.forEach(w=>{const i=left.indexOf(w);if(i>=0)left.splice(i,1)});$('bank').innerHTML='';left.forEach((w,i)=>addWord(w,i,level===1))}
function speak(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-CA';speechSynthesis.speak(u)}
$('clear').onclick=()=>{chosen=[];renderBankFromState();drawChosen()};
function normalized(s){return s.toLowerCase().replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
$('check').onclick=()=>{const x=items[idx];let val=(level<=2?chosen.join(' '):$('entry').value);attempts[idx].push(val);if(!val.trim()){showBad('Write or build a sentence first.');return}
if(level<=2){if(normalized(val)===normalized(x.s)){showGood('Correct!');complete()}else showBad('Not quite. Try again.')}
else{const t=val.trim(),capital=/^[A-Z]/.test(t),period=/\.$/.test(t);if(capital&&period){showGood('Capital letter ✓  Period ✓');complete()}else{let m=[];if(!capital)m.push('start with a capital letter');if(!period)m.push('end with a period');showBad('Check your sentence: '+m.join(' and ')+'.')}}};
function showGood(t){$('feedback').textContent=t;$('feedback').className='feedback good'}function showBad(t){$('feedback').textContent=t;$('feedback').className='feedback bad'}
function complete(){$('check').classList.add('hidden');$('next').classList.remove('hidden');$('bar').style.width=((idx+1)/items.length*100)+'%'}
$('next').onclick=()=>{idx++;if(idx<items.length)render();else finish()};
function finish(){$('activity').classList.add('hidden');$('finish').classList.remove('hidden');buildReport()}
function buildReport(){ $('reportInfo').textContent='Level '+level+' • Picture Set '+setNo;const body=$('reportBody');body.innerHTML='';items.forEach((x,i)=>{const d=document.createElement('div');d.className='report-item';d.innerHTML='<h3>Picture '+(i+1)+'</h3><img src="'+imgPath(x)+'" alt=""><div>'+attempts[i].map((a,j)=>'<p class="attempt"><strong>'+ordinal(j+1)+' Attempt:</strong> '+escapeHtml(a||'(blank)')+'</p>').join('')+'</div>';body.appendChild(d)})}
function ordinal(n){return n===1?'First':n===2?'Second':n===3?'Third':n+'th'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('showReport').onclick=()=>{$('report').classList.toggle('hidden');if(!$('report').classList.contains('hidden'))$('report').scrollIntoView({behavior:'smooth'})};
$('printPdf').onclick=()=>{$('report').classList.remove('hidden');buildReport();setTimeout(()=>window.print(),150)};
$('again').onclick=()=>location.reload();
</script></body></html>
