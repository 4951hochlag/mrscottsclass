<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Sentences: Prepositions | Mr. Scott's Class</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f6f8fc; color: #172033; }
    header { text-align: center; background: white; padding: 26px 16px; border-bottom: 1px solid #e4e8f0; }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 3rem); }
    h2 { margin-top: 0; }
    main { width: min(840px, 94%); margin: 24px auto; }
    .back { color: #263b65; font-weight: 700; }
    .card { background: white; border: 2px solid #e3e8f1; border-radius: 20px; padding: clamp(16px, 4vw, 28px); margin: 18px 0; box-shadow: 0 5px 14px #17203312; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .center { justify-content: center; text-align: center; }
    fieldset { margin: 0 0 18px; padding: 0; border: 0; }
    legend { margin-bottom: 8px; font-weight: bold; }
    .level-option { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 0; }
    .level-option input { width: 19px; height: 19px; }
    .progress { justify-content: space-between; color: #526078; }
    button { min-height: 48px; border: 2px solid #aebfe6; border-radius: 12px; padding: 8px 14px; font: inherit; font-weight: bold; color: #243c69; background: #eef3ff; cursor: pointer; }
    button.primary { color: white; background: #244d9b; border-color: #244d9b; }
    button:disabled { cursor: default; }
    :focus-visible { outline: 3px solid #3559a8; outline-offset: 3px; }
    .picture-frame { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; height: min(35vh, 280px); margin: 12px auto; }
    .scene-picture { display: block; width: min(100%, calc(var(--picture-ratio, 1) * var(--picture-height))); height: auto; clip-path: var(--picture-clip, none); }
    #picture { --picture-height: min(35vh, 280px); }
    button[aria-pressed="true"] { background: #244d9b; color: white; }
    button:disabled { opacity: 0.55; }
    .review-list { padding-left: 1.6rem; }
    .review-list li { border-top: 1px solid #e3e8f1; padding: 18px 0; }
    .review-picture { --picture-height: 180px; }
    .review-answer { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .prompt { margin: 14px 0; font-size: clamp(1.2rem, 4vw, 1.65rem); font-weight: bold; }
    .blank { display: inline-block; min-width: 6ch; border-bottom: 2px solid currentColor; }
    label { display: block; font-weight: bold; margin: 12px 0 8px; }
    textarea { width: 100%; min-height: 90px; resize: vertical; border: 2px solid #aeb8c8; border-radius: 12px; padding: 12px; font: inherit; font-size: 1.2rem; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .word-bank span { background: #eef3ff; border-radius: 8px; padding: 6px 10px; }
    .feedback { min-height: 1.4em; text-align: center; font-weight: bold; margin: 12px 0; }
    .retry { color: #9b2929; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>Picture Sentences: Prepositions</h1></header>
  <main>
    <a class="back" href="../">Back to English</a>

    <section id="setup" class="card">
      <h2 id="setup-heading" tabindex="-1">Choose an activity</h2>
      <fieldset>
        <legend>Practice level</legend>
        <div class="row">
          <label class="level-option"><input name="level" type="radio" value="core" checked> Core practice</label>
          <label class="level-option"><input name="level" type="radio" value="extended"> Extended practice</label>
        </div>
      </fieldset>
      <div class="row">
        <button class="primary" id="choose-mode" type="button">Choose the preposition</button>
        <button class="primary" id="write-mode" type="button">Write the sentence</button>
      </div>
    </section>

    <section id="practice" class="card" hidden>
      <div class="row progress">
        <strong id="progress"></strong>
        <button id="change-mode" type="button">Change activity</button>
      </div>
      <div class="picture-frame"><img id="picture" class="scene-picture" alt=""></div>
      <p id="image-error" class="feedback retry" role="status" hidden>This picture could not load.</p>
      <h2 id="question" class="row center prompt">
        <span id="prompt" tabindex="-1"></span>
        <button id="hear-prompt" type="button" aria-label="Hear the prompt">🔊</button>
      </h2>
      <form id="response-form">
        <div id="choices" class="row center" role="group" aria-label="Preposition choices"></div>
        <div id="writing" hidden>
          <label for="answer">Write a complete sentence.</label>
          <textarea id="answer" rows="2" spellcheck="true"></textarea>
          <div id="word-bank" class="word-bank" hidden></div>
        </div>
        <div class="row center" style="margin-top: 16px">
          <button id="bank-toggle" type="button" aria-controls="word-bank" aria-expanded="false" hidden>Show word bank</button>
          <button id="next" class="primary" type="submit" disabled>Next picture</button>
        </div>
      </form>
    </section>

    <section id="finished" class="card" hidden>
      <h2 id="finished-heading" tabindex="-1">Round complete</h2>
      <div class="row">
        <button id="show-work" class="primary" type="button">Show my work</button>
        <button id="again" type="button">Practise again</button>
        <button id="finish-change" type="button">Change activity</button>
      </div>
    </section>
    <section id="review" class="card" hidden>
      <h2 id="review-heading" tabindex="-1">My work</h2>
      <ol id="review-list" class="review-list"></ol>
      <button id="back-to-finish" type="button">Back to round complete</button>
    </section>
  </main>
  <script>
    const groups = {
      ball: ['ball_table_15_images', 'a ball and a table'],
      bench: ['cat_box_15_images/boy_girl_bench_14_no_text', 'two children and a bench'],
      cat: ['cat_box_15_images', 'a cat and a box'],
      bear: ['teddy_bear_chair_15_images', 'a teddy bear and a chair']
    };

    // Each image has its own subject and reference objects, especially for "between".
    const scenes = [
      ['ball', '01_on.jpg', 'The ball is', 'on', 'the table'],
      ['ball', '02_under.jpg', 'The ball is', 'under', 'the table'],
      ['ball', '03_beside.jpg', 'The ball is', 'beside', 'the table'],
      ['ball', '04_behind.jpg', 'The ball is', 'behind', 'the table'],
      ['ball', '05_in_front_of-clear.jpg', 'The ball is', 'in front of', 'the table'],
      ['ball', '06_between.jpg', 'The ball is', 'between', 'the two tables'],
      ['bench', '01_on.jpg', 'The children are', 'on', 'the bench'],
      ['bench', '02_under.jpg', 'The boy is', 'under', 'the bench'],
      ['bench', '03_beside.jpg', 'The girl is', 'beside', 'the bench'],
      ['bench', '04_behind.jpg', 'The boy is', 'behind', 'the girl'],
      ['bench', '05_in_front_of.jpg', 'The girl is', 'in front of', 'the boy'],
      ['bench', '06_between.jpg', 'The bench is', 'between', 'the two children'],
      ['cat', 'cat_box_01.jpg', 'The cat is', 'in', 'the box'],
      ['cat', 'cat_box_02.jpg', 'The cat is', 'on', 'the box'],
      ['cat', 'cat_box_03.jpg', 'The cat is', 'under', 'the box'],
      ['cat', 'cat_box_04.jpg', 'The cat is', 'beside', 'the box'],
      ['cat', 'cat_box_05.jpg', 'The cat is', 'behind', 'the box'],
      ['cat', 'cat_box_06.jpg', 'The cat is', 'in front of', 'the box'],
      ['cat', 'cat_box_07.jpg', 'The cat is', 'between', 'the two boxes'],
      ['bear', '01_on.jpg', 'The teddy bear is', 'on', 'the chair'],
      ['bear', '02_under.jpg', 'The teddy bear is', 'under', 'the chair'],
      ['bear', '03_beside.jpg', 'The teddy bear is', 'beside', 'the chair'],
      ['bear', '04_behind-floor.jpg', 'The teddy bear is', 'behind', 'the chair'],
      ['bear', '05_in_front_of.jpg', 'The teddy bear is', 'in front of', 'the chair'],
      ['bear', '06_between.jpg', 'The teddy bear is', 'between', 'the two chairs']
    ];

    const extendedScenes = [
      ['ball', '07_to_the_left_of.jpg', 'The ball is', 'to the left of', 'the table', 'Which side of the table is the ball on?'],
      ['ball', '08_to_the_right_of.jpg', 'The ball is', 'to the right of', 'the table', 'Which side of the table is the ball on?'],
      ['ball', '10_near.jpg', 'The ball is', 'near', 'the table', 'How close is the ball to the table?'],
      ['ball', '11_far_from.jpg', 'The ball is', 'far from', 'the table', 'How close is the ball to the table?'],
      ['ball', '15_around.jpg', 'The ball is rolling', 'around', 'the table', 'Where is the ball rolling?'],
      ['bench', '07_left_of.jpg', 'The boy is', 'to the left of', 'the girl', 'Which side of the girl is the boy on?'],
      ['bench', '08_right_of.jpg', 'The boy is', 'to the right of', 'the girl', 'Which side of the girl is the boy on?'],
      ['bench', '09_across.jpg', 'The girl is lying', 'across', 'the bench', 'How is the girl lying on the bench?'],
      ['bench', '11_near.jpg', 'The boy is', 'near', 'the girl', 'How close is the boy to the girl?'],
      ['bench', '14_far_from.jpg', 'The boy is', 'far from', 'the girl', 'How close is the boy to the girl?'],
      ['bench', '15_around.jpg', 'The children are walking', 'around', 'the bench', 'Where are the children walking?'],
      ['cat', 'cat_box_08.jpg', 'The cat is', 'to the left of', 'the box', 'Which side of the box is the cat on?'],
      ['cat', 'cat_box_09.jpg', 'The cat is', 'to the right of', 'the box', 'Which side of the box is the cat on?'],
      ['cat', 'cat_box_10.jpg', 'The cat is', 'near', 'the box', 'How close is the cat to the box?'],
      ['cat', 'cat_box_11.jpg', 'The cat is', 'far from', 'the box', 'How close is the cat to the box?'],
      ['cat', 'cat_box_13.jpg', 'The cat is coming', 'out of', 'the box', 'Where is the cat coming from?'],
      ['cat', 'cat_box_14.jpg', 'The cat is moving', 'around', 'the box', 'Where is the cat moving?'],
      ['cat', 'cat_box_15.jpg', 'The cat is walking', 'toward', 'the box', 'Which way is the cat walking?'],
      ['bear', '07_left_of.jpg', 'The teddy bear is', 'to the left of', 'the chair', 'Which side of the chair is the teddy bear on?'],
      ['bear', '08_right_of.jpg', 'The teddy bear is', 'to the right of', 'the chair', 'Which side of the chair is the teddy bear on?'],
      ['bear', '09_across.jpg', 'The teddy bear is lying', 'across', 'the chair', 'How is the teddy bear lying on the chair?'],
      ['bear', '11_far_from.jpg', 'The teddy bear is', 'far from', 'the chair', 'How close is the teddy bear to the chair?'],
      ['bear', '12_onto.jpg', 'The teddy bear is climbing', 'onto', 'the chair', 'Where is the teddy bear climbing?'],
      ['bear', '15_near.jpg', 'The teddy bear is', 'near', 'the chair', 'How close is the teddy bear to the chair?']
    ];

    // Insets in source pixels, clockwise from the top edge.
    const pictureInsets = {
      ball: {
        1: [5, 0, 0, 7], 2: [5, 0, 0, 6], 3: [5, 0, 0, 5],
        4: [5, 4, 0, 0], 6: [0, 0, 13, 6],
        7: [0, 0, 13, 6], 8: [0, 0, 13, 5], 10: [0, 5, 13, 0],
        11: [0, 0, 10, 6], 15: [0, 5, 10, 0]
      },
      bench: {
        1: [3, 0, 0, 0], 2: [3, 3, 0, 0], 3: [3, 4, 0, 0],
        4: [3, 6, 0, 0], 5: [3, 4, 0, 0], 6: [3, 0, 0, 0],
        7: [3, 3, 0, 0], 8: [3, 4, 0, 0], 9: [3, 6, 0, 0],
        11: [3, 0, 0, 0], 14: [3, 6, 0, 0], 15: [3, 3, 0, 0]
      },
      cat: {
        1: [18, 5, 10, 13], 2: [18, 8, 10, 12], 3: [18, 10, 10, 10],
        4: [18, 11, 10, 7], 5: [18, 13, 10, 5], 6: [10, 5, 23, 13],
        7: [10, 8, 23, 12], 8: [10, 10, 23, 10], 9: [10, 11, 23, 7],
        10: [10, 13, 23, 5], 11: [0, 5, 19, 13], 13: [0, 10, 19, 10],
        14: [0, 11, 19, 7], 15: [0, 13, 19, 5]
      },
      bear: {
        1: [17, 7, 9, 13], 2: [17, 6, 9, 8], 3: [17, 7, 9, 10],
        5: [17, 12, 9, 10], 6: [9, 8, 10, 13],
        7: [9, 6, 10, 8], 8: [9, 7, 10, 10], 9: [9, 6, 10, 9],
        11: [11, 8, 22, 13], 12: [11, 6, 22, 8], 15: [11, 12, 22, 10]
      }
    };

    const alternatives = {
      'in': ['on', 'under'],
      'on': ['under', 'beside'],
      'under': ['on', 'behind'],
      'beside': ['on', 'under'],
      'behind': ['in front of', 'under'],
      'in front of': ['behind', 'under'],
      'between': ['behind', 'in front of'],
      'to the left of': ['to the right of', 'under'],
      'to the right of': ['to the left of', 'under'],
      'near': ['far from', 'under'],
      'far from': ['near', 'on'],
      'across': ['under', 'beside'],
      'around': ['away from', 'under'],
      'onto': ['off', 'under'],
      'out of': ['into', 'around'],
      'toward': ['away from', 'around']
    };

    const names = document.querySelectorAll('[id]');
    const ui = Object.fromEntries(Array.from(names, element => [element.id, element]));
    const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    let mode;
    let round = [];
    let step = 0;
    let answers = [];
    let selectedChoice = '';
    let pictureReady = false;
    let pictureFailed = false;

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function speak(text) {
      if (!canSpeak) return;
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'en-CA';
      speech.rate = 0.85;
      window.speechSynthesis.speak(speech);
    }

    function show(section) {
      ui.setup.hidden = section !== ui.setup;
      ui.practice.hidden = section !== ui.practice;
      ui.finished.hidden = section !== ui.finished;
      ui.review.hidden = section !== ui.review;
      if (canSpeak) window.speechSynthesis.cancel();
    }

    function start(activity) {
      mode = activity;
      const level = document.querySelector('input[name="level"]:checked').value;
      const pool = level === 'extended' ? extendedScenes : scenes;
      const targets = new Set(pool.map(scene => scene[3]));
      const byPreposition = Array.from(targets, preposition =>
        shuffle(pool.filter(scene => scene[3] === preposition))[0]
      );
      round = shuffle(byPreposition);
      answers = [];
      ui['review-list'].replaceChildren();
      step = 0;
      show(ui.practice);
      render();
    }

    function response() {
      return mode === 'choose' ? selectedChoice : ui.answer.value;
    }

    function updateNext() {
      ui.next.disabled = !pictureFailed && (!pictureReady || !response().trim());
    }

    function setPictureReady(ready) {
      pictureReady = ready;
      ui.answer.disabled = !ready;
      for (const button of ui.choices.children) button.disabled = !ready;
      updateNext();
    }

    function pictureDetails(scene) {
      const [group, filename] = scene;
      const [folder, description] = groups[group];
      return ['images/' + folder + '/' + filename, 'Location practice picture with ' + description];
    }

    function writingPrompt(scene) {
      const [, , subject, , , question] = scene;
      const words = subject.split(' ');
      return question ?? 'Where ' + words.pop() + ' ' + words.join(' ').toLowerCase() + '?';
    }

    function setBank(open) {
      ui['word-bank'].hidden = !open;
      ui['bank-toggle'].setAttribute('aria-expanded', String(open));
      ui['bank-toggle'].textContent = open ? 'Hide word bank' : 'Show word bank';
    }

    function render() {
      const scene = round[step];
      const [, , subject, preposition, reference] = scene;
      const [src, alt] = pictureDetails(scene);
      selectedChoice = '';
      pictureFailed = false;
      ui['image-error'].hidden = true;
      ui.next.textContent = step + 1 === round.length ? 'Finish' : 'Next picture';
      ui.progress.textContent = 'Picture ' + (step + 1) + ' of ' + round.length;
      ui.choices.replaceChildren();
      ui.choices.hidden = mode !== 'choose';
      ui.writing.hidden = mode !== 'write';
      ui.answer.value = '';
      ui['bank-toggle'].hidden = mode !== 'write';
      setBank(false);
      if (mode === 'choose') {
        const blank = document.createElement('span');
        blank.className = 'blank';
        blank.setAttribute('aria-label', 'blank');
        ui.prompt.replaceChildren(subject + ' ', blank, ' ' + reference + '.');
        for (const choice of shuffle([preposition, ...alternatives[preposition]])) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = choice;
          button.setAttribute('aria-pressed', 'false');
          button.onclick = () => {
            selectedChoice = choice;
            for (const option of ui.choices.children) {
              option.setAttribute('aria-pressed', String(option === button));
            }
            updateNext();
          };
          ui.choices.append(button);
        }
      } else {
        ui.prompt.textContent = writingPrompt(scene);
        ui['word-bank'].replaceChildren();
        for (const word of shuffle([preposition, ...alternatives[preposition]])) {
          const item = document.createElement('span');
          item.textContent = word;
          ui['word-bank'].append(item);
        }
      }
      ui['hear-prompt'].hidden = !canSpeak;
      ui['hear-prompt'].onclick = () => speak(mode === 'choose'
        ? subject + ' blank ' + reference + '.'
        : ui.prompt.textContent);
      setPictureReady(false);
      ui.picture.alt = alt;
      ui.picture.style.visibility = 'hidden';
      ui.picture.src = src;
      if (ui.picture.complete && ui.picture.naturalWidth) displayPicture();
      ui.prompt.focus();
    }

    function stylePicture(image, scene) {
      const [group, filename] = scene;
      const imageNumber = Number(filename.match(/\d+/)?.[0]);
      const [top, right, bottom, left] = pictureInsets[group]?.[imageNumber] ?? [0, 0, 0, 0];
      const { naturalWidth: width, naturalHeight: height, style } = image;
      style.setProperty('--picture-ratio', width / height);
      style.setProperty('--picture-clip', `inset(${100 * top / height}% ${100 * right / width}% ${100 * bottom / height}% ${100 * left / width}%)`);
    }

    function displayPicture() {
      stylePicture(ui.picture, round[step]);
      ui.picture.style.visibility = '';
      setPictureReady(true);
    }

    function showWork() {
      ui['review-list'].replaceChildren();
      for (const [index, scene] of round.entries()) {
        const [, , subject, , reference] = scene;
        const [src, alt] = pictureDetails(scene);
        const answer = answers[index];
        const item = document.createElement('li');
        const picture = document.createElement('img');
        picture.className = 'scene-picture review-picture';
        picture.alt = alt;
        picture.onload = () => stylePicture(picture, scene);
        picture.onerror = () => {
          const missing = document.createElement('p');
          missing.textContent = 'This picture could not load.';
          picture.replaceWith(missing);
        };
        picture.src = src;
        const prompt = document.createElement('p');
        prompt.textContent = mode === 'choose' ? subject + ' ___ ' + reference + '.' : writingPrompt(scene);
        const result = document.createElement('p');
        result.className = 'review-answer';
        const label = document.createElement('strong');
        label.textContent = 'Your answer: ';
        result.append(label, answer ?? 'No answer recorded.');
        item.append(picture, prompt, result);
        if (canSpeak && answer !== null) {
          const hear = document.createElement('button');
          hear.type = 'button';
          hear.textContent = 'Hear your answer';
          hear.onclick = () => speak(mode === 'choose' ? subject + ' ' + answer + ' ' + reference + '.' : answer);
          item.append(hear);
        }
        ui['review-list'].append(item);
      }
      show(ui.review);
      ui['review-heading'].focus();
    }

    ui.picture.onload = displayPicture;
    ui.picture.onerror = () => {
      ui['image-error'].hidden = false;
      pictureFailed = true;
      ui.next.textContent = step + 1 === round.length ? 'Finish' : 'Skip picture';
      setPictureReady(false);
    };
    ui['choose-mode'].onclick = () => start('choose');
    ui['write-mode'].onclick = () => start('write');
    ui['bank-toggle'].onclick = () => setBank(ui['word-bank'].hidden);
    ui.answer.oninput = updateNext;
    ui['response-form'].onsubmit = event => {
      event.preventDefault();
      if (ui.next.disabled) return;
      answers.push(pictureFailed ? null : response());
      if (canSpeak) window.speechSynthesis.cancel();
      step += 1;
      if (step < round.length) render();
      else {
        show(ui.finished);
        ui['finished-heading'].focus();
      }
    };
    ui['show-work'].onclick = showWork;
    ui['back-to-finish'].onclick = () => {
      show(ui.finished);
      ui['show-work'].focus();
    };
    ui.again.onclick = () => start(mode);
    ui['change-mode'].onclick = ui['finish-change'].onclick = () => {
      show(ui.setup);
      ui['setup-heading'].focus();
    };
  </script>
</body>
</html>
